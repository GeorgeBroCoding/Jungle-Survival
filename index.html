// ============================================================
// grass.js - instanced ground cover that follows the player
//
// Real grass is the single biggest thing separating "flat green plane" from
// "ground you're standing on". Blades are instanced into a disc of cells around
// the player; as you walk, cells that fall out of range are recycled into the
// ones that just came into range, so the instance count is constant and nothing
// is allocated per frame. Each cell's contents are derived from its coordinates,
// so a cell looks identical every time you walk back over it.
// ============================================================
const GRASS_CELL = 2.6;
const GRASS_BLADE_H = 0.55;
// Packs a signed cell coordinate pair into one integer for Map keys - cheaper
// than building strings every time the player crosses a cell boundary.
const GRASS_KEY_BIAS = 4096;
function grassKey(cx, cz) {
  return (cx + GRASS_KEY_BIAS) * 8192 + (cz + GRASS_KEY_BIAS);
}

function buildGrassBladeGeometry() {
  // Normalised to 1 unit tall so the wind shader can read position.y directly
  // as "how far up this blade are we" and bend the tip without moving the root.
  const steps = 4;
  const positions = [], uvs = [], colors = [], indices = [];
  const root = [0.16, 0.26, 0.10];
  const tip = [0.60, 0.82, 0.34];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const hw = 0.024 * (1 - t) * (1 - t * 0.35) + 0.0015;
    const z = 0.13 * t * t; // blades arch over rather than standing to attention
    positions.push(-hw, t, z, hw, t, z);
    uvs.push(0, t, 1, t);
    for (let k = 0; k < 2; k++) {
      colors.push(
        root[0] + (tip[0] - root[0]) * t,
        root[1] + (tip[1] - root[1]) * t,
        root[2] + (tip[2] - root[2]) * t
      );
    }
    if (i > 0) {
      const a = (i - 1) * 2, b = a + 1, c = i * 2, d = c + 1;
      indices.push(a, c, b, b, c, d);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setIndex(indices);
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  return geo;
}

// How much ground cover each biome gets. Sand and snow are nearly bare; the
// swamp is nearly solid.
function grassDensityForBiome(b) {
  if (b === 0) return 1.0;    // woodland
  if (b === 1) return 0.06;   // sandy
  if (b === 2) return 0.10;   // snow
  if (b === 3) return 0.22;   // rocky
  return 0.92;                // swamp
}

// Move the ring of populated cells to be centred on (cx, cz): hand back every
// cell that just fell out of range, then claim the ones that just came in and
// hand each to `fill`. Kept out of the component so it can be exercised
// directly - the pool must never leak a block or run dry, and a cell that stays
// in range must keep the exact blades it already had, or the grass visibly
// reshuffles itself every time you take a step.
function recycleGrassCells(book, plan, cx, cz, radius, fill) {
  book.cx = cx;
  book.cz = cz;

  for (const [key, block] of book.live) {
    const kx = Math.floor(key / 8192) - GRASS_KEY_BIAS;
    const kz = (key % 8192) - GRASS_KEY_BIAS;
    if (Math.hypot((kx - cx) * GRASS_CELL, (kz - cz) * GRASS_CELL) > radius) {
      book.free.push(block);
      book.live.delete(key);
    }
  }

  for (const off of plan.offs) {
    const gx = cx + off[0];
    const gz = cz + off[1];
    const key = grassKey(gx, gz);
    if (book.live.has(key)) continue;
    const block = book.free.pop();
    if (block === undefined) break; // pool exhausted; leave the rest bare
    book.live.set(key, block);
    fill(block, gx, gz);
  }
}

function GrassField() {
  const quality = useGame((s) => s.graphicsQuality);
  const q = GRAPHICS_PRESETS[quality] || gfx();
  const ref = useRef();
  const timeU = useMemo(() => ({ value: 0 }), []);
  const windU = useMemo(() => ({ value: 0.16 }), []);
  const geo = useMemo(() => buildGrassBladeGeometry(), []);

  const mat = useMemo(() => {
    const m = new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.78,
      metalness: 0,
      side: THREE.DoubleSide,
      envMapIntensity: 0.25,
    });
    // aPhase is our own instanced attribute, declared here rather than relying
    // on anything three exposes internally, so this stays stable across
    // three.js versions. Only the begin_vertex chunk name is assumed.
    m.onBeforeCompile = (shader) => {
      if (shader.vertexShader.indexOf('#include <begin_vertex>') === -1) return;
      shader.uniforms.uTime = timeU;
      shader.uniforms.uWind = windU;
      shader.vertexShader =
        'attribute float aPhase;\nuniform float uTime;\nuniform float uWind;\n' + shader.vertexShader;
      shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>', [
        'vec3 transformed = vec3( position );',
        'float bladeUp = clamp( position.y, 0.0, 1.0 );',
        // Two sines at different rates: a slow roll with a faster flutter on
        // top, so gusts never look metronomic.
        'float sway = sin( uTime * 1.7 + aPhase ) * 0.6 + sin( uTime * 3.3 + aPhase * 1.9 ) * 0.25;',
        'float bend = bladeUp * bladeUp * uWind;',
        'transformed.x += sway * bend;',
        'transformed.z += cos( uTime * 1.3 + aPhase * 0.7 ) * bend * 0.55;',
      ].join('\n'));
    };
    return m;
  }, [timeU, windU]);

  // The ring of cells we keep populated, nearest first, plus how many blade
  // slots that needs. Constant for a given quality preset, so the pool can be
  // sized exactly and never grow.
  const plan = useMemo(() => {
    const offs = [];
    const span = Math.ceil(q.grassRadius / GRASS_CELL);
    for (let dz = -span; dz <= span; dz++) {
      for (let dx = -span; dx <= span; dx++) {
        const d = Math.hypot(dx, dz) * GRASS_CELL;
        if (d <= q.grassRadius) offs.push([dx, dz, d]);
      }
    }
    offs.sort((a, b) => a[2] - b[2]);
    return { offs, blocks: offs.length, perCell: q.grassPerCell, capacity: offs.length * q.grassPerCell };
  }, [q.grassRadius, q.grassPerCell]);

  const phaseAttr = useMemo(
    () => new THREE.InstancedBufferAttribute(new Float32Array(Math.max(1, plan.capacity)), 1),
    [plan.capacity]
  );

  // Cell bookkeeping. Rebuilt whenever the pool is resized by a quality change.
  const book = useMemo(() => ({
    live: new Map(),
    free: [],
    cx: null,
    cz: null,
  }), [plan.capacity]);

  useEffect(() => {
    book.live.clear();
    book.free.length = 0;
    for (let i = plan.blocks - 1; i >= 0; i--) book.free.push(i);
    book.cx = null;
    book.cz = null;
  }, [book, plan.blocks]);

  useEffect(() => {
    const mesh = ref.current;
    if (mesh) mesh.geometry.setAttribute('aPhase', phaseAttr);
  }, [phaseAttr, geo]);

  const scratch = useMemo(() => ({
    m: new THREE.Matrix4(),
    q: new THREE.Quaternion(),
    e: new THREE.Euler(),
    v: new THREE.Vector3(),
    s: new THREE.Vector3(),
    c: new THREE.Color(),
  }), []);

  useFrame((_, delta) => {
    const mesh = ref.current;
    if (!mesh || plan.capacity === 0) return;
    timeU.value += delta;
    // Wind comes in slow gusts rather than sitting at one strength.
    windU.value = 0.13 + Math.sin(timeU.value * 0.23) * 0.06 + Math.sin(timeU.value * 0.07) * 0.035;

    const px = playerTransform.position[0];
    const pz = playerTransform.position[2];
    const cx = Math.floor(px / GRASS_CELL);
    const cz = Math.floor(pz / GRASS_CELL);
    if (book.cx === cx && book.cz === cz) return; // nothing to re-scatter

    const per = plan.perCell;
    const sc = scratch;
    recycleGrassCells(book, plan, cx, cz, q.grassRadius, (block, gx, gz) => {
      const rand = mulberry32(((gx & 0xffff) << 16 ^ (gz & 0xffff)) + 17);
      const cellX = gx * GRASS_CELL;
      const cellZ = gz * GRASS_CELL;
      const density = grassDensityForBiome(getDominantBiome(cellX, cellZ));
      for (let i = 0; i < per; i++) {
        const idx = block * per + i;
        const x = cellX + rand() * GRASS_CELL;
        const z = cellZ + rand() * GRASS_CELL;
        const keep = rand() <= density
          && Math.hypot(x - POND_CENTER[0], z - POND_CENTER[1]) > POND_RADIUS + 0.6;
        if (!keep) {
          // Collapse unwanted blades to nothing rather than shrinking the pool -
          // keeps the slot bookkeeping trivial.
          sc.m.makeScale(0, 0, 0);
          mesh.setMatrixAt(idx, sc.m);
          phaseAttr.array[idx] = 0;
          continue;
        }
        const h = GRASS_BLADE_H * (0.55 + rand() * 0.9);
        const w = 0.8 + rand() * 0.7;
        sc.e.set((rand() - 0.5) * 0.28, rand() * Math.PI * 2, (rand() - 0.5) * 0.28);
        sc.q.setFromEuler(sc.e);
        sc.v.set(x, getTerrainHeight(x, z) - 0.03, z);
        sc.s.set(w, h, w);
        sc.m.compose(sc.v, sc.q, sc.s);
        mesh.setMatrixAt(idx, sc.m);
        const [br, bg, bb] = getBiomeColor(x, z);
        const lift = 1.5 + rand() * 1.1; // biome colours are dark; blades catch more light
        sc.c.setRGB(
          Math.min(1, br * lift),
          Math.min(1, bg * lift * 1.05),
          Math.min(1, bb * lift)
        );
        mesh.setColorAt(idx, sc.c);
        phaseAttr.array[idx] = rand() * Math.PI * 2;
      }
    });

    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    phaseAttr.needsUpdate = true;
  });

  if (plan.capacity === 0) return null;

  return html`
    <instancedMesh
      ref=${ref}
      args=${[geo, mat, plan.capacity]}
      castShadow=${false}
      receiveShadow=${true}
      frustumCulled=${false}
    />
  `;
}

// ---------- Decorative scattered foliage (non-interactable, purely visual) ----------
// Drawn as instances: a few hundred detailed plants cost the same handful of
// draw calls as a few dozen did before.
function DecorativeFoliage() {
  const quality = useGame((s) => s.graphicsQuality);
  const q = GRAPHICS_PRESETS[quality] || gfx();

  const instances = useMemo(() => {
    const rand = mulberry32(99);
    const detail = q.treeDetail;
    const out = [];
    // Each plant also stamps its canopy into the cover field, which is what
    // the eye-adaptation code reads to know you have walked into shade.
    // `shade` is the radius of leaf it actually puts over your head.
    canopyReset();
    const add = (model, x, y, z, scale, shade) => {
      out.push({ model, position: [x, y, z], scale, rotY: rand() * Math.PI * 2 });
      if (shade > 0) canopySplat(x, z, shade * scale, 1.15);
    };
    for (let i = 0; i < q.foliage; i++) {
      const angle = rand() * Math.PI * 2;
      const dist = 10 + rand() * 220;
      const x = Math.cos(angle) * dist;
      const z = Math.sin(angle) * dist;
      if (Math.hypot(x, z) < 10) continue;
      const pondDist = Math.hypot(x - POND_CENTER[0], z - POND_CENTER[1]);
      if (pondDist < 14) continue; // keep the water clear
      const y = getTerrainHeight(x, z);
      const s = 0.7 + rand() * 0.9;
      const biome = getDominantBiome(x, z);
      if (biome === 0) {
        // Woodland: mostly broadleaf jungle trees, palms near the water, bushes
        // filling the gaps between.
        const roll = rand();
        if (pondDist < 32 && roll > 0.55) add(buildPalmModel(rand, detail), x, y, z, 0.8 + rand() * 0.5, 3.1);
        else if (roll > 0.34) add(buildJungleTreeModel(rand, detail), x, y, z, s, 4.6);
        else add(buildBushModel(rand, detail, false), x, y, z, s * 0.95, 1.2);
      } else if (biome === 1) {
        if (rand() > 0.5) add(buildCactusModel(rand, detail), x, y, z, 0.7 + rand() * 0.7, 0);
        else if (rand() > 0.7) add(buildRockModel(rand, detail), x, y, z, 0.4 + rand() * 0.8, 0);
      } else if (biome === 2) {
        if (rand() > 0.3) add(buildPineModel(rand, detail, true), x, y, z, s, 2.6);
        else if (rand() > 0.6) add(buildRockModel(rand, detail), x, y, z, 0.35 + rand() * 0.6, 0);
      } else if (biome === 3) {
        if (rand() > 0.35) add(buildRockModel(rand, detail), x, y, z, 0.45 + rand() * 1.7, 0);
        else if (rand() > 0.6) add(buildPineModel(rand, detail, false), x, y, z, s * 0.85, 2.4);
      } else {
        // Swamp: low dark growth with the occasional palm standing out of it.
        if (rand() > 0.72) add(buildPalmModel(rand, detail), x, y, z, 0.75 + rand() * 0.5, 3.1);
        else add(buildBushModel(rand, detail, true), x, y, z, s * 1.05, 1.4);
      }
    }
    // The harvestable trees and bushes shade you just as much as the decorative
    // ones - more, in fact, since they cluster around the spawn and the base,
    // which is exactly where you spend your time. Leaving them out meant the
    // eye-adaptation code thought you were standing in an open field while you
    // were under a closed canopy, and the exposure never moved.
    for (const node of useGame.getState().resourceNodes) {
      if (node.type === 'wood') canopySplat(node.position[0], node.position[2], 4.6 * 1.1, 1.15);
      else if (node.type === 'fiber') canopySplat(node.position[0], node.position[2], 1.2 * 1.2, 1.15);
    }
    canopyField.ready = true;
    return out;
  }, [q.foliage, q.treeDetail]);

  return html`<${InstancedModels} instances=${instances} />`;
}

function World() {
  return html`
    <${Fragment}>
      <${DayNightSystem} />
      <fog attach="fog" args=${['#bcdaef', 40, 305]} />
      <${Ground} />
      <${Water} />
      <${GrassField} />
      <${DecorativeFoliage} />
    <//>
  `;
}

// ============================================================
// humanbody.js - shared anatomy for every person in the game
//
// One body definition drives the player, the remote player, tribe members,
// raiders and recruited warriors, so they all move and read the same way.
// Limbs are lathed profiles rather than plain capsules: an upper arm is thick
// at the shoulder and thin at the elbow, a calf has a belly to it. The
// animation contract is unchanged - callers still hand in armL/armR/legL/legR
// refs and rotate them about X - so every existing walk, swing and death
// animation keeps working.
// ============================================================

// Proportions for a roughly 1.85m person, in metres from the ground.
const BODY = {
  hipY: 0.92,
  shoulderY: 1.50,
  headY: 1.70,
  shoulderX: 0.215,
  hipX: 0.095,
  upperArm: 0.32,
  foreArm: 0.28,
  thigh: 0.50,
  shin: 0.42,
  torsoTop: 1.55,
  torsoLen: 0.60,
};
// The hand sits here relative to the shoulder pivot. HeldWeapon models are
// authored with their grip 0.5 below the old shoulder, so this offset slides
// them down into the longer arm's actual hand.
const WEAPON_HAND_OFFSET = [0, -0.15, 0.03];

// Profiles run top (t=0) to bottom (t=1) with radius normalised to 1, so a
// part's scale is literally its radius and length in metres. The points are
// reversed on the way in because LatheGeometry wants ascending Y to get its
// normals pointing outward.
function latheLimb(profile, segments) {
  const pts = [];
  for (let i = profile.length - 1; i >= 0; i--) {
    pts.push(new THREE.Vector2(Math.max(0.003, profile[i][1]), -profile[i][0]));
  }
  return new THREE.LatheGeometry(pts, segments);
}

const HUMAN_GEO = {};
function humanGeo(key) {
  if (HUMAN_GEO[key]) return HUMAN_GEO[key];
  let g;
  if (key === 'ball') g = new THREE.SphereGeometry(1, 16, 12);
  else if (key === 'ballLow') g = new THREE.SphereGeometry(1, 10, 8);
  else if (key === 'box') g = new THREE.BoxGeometry(1, 1, 1);
  else if (key === 'torso') {
    // Broad at the chest, tucked at the waist, flaring again at the hips.
    g = latheLimb([[0, 0.60], [0.08, 0.92], [0.26, 1.0], [0.52, 0.84], [0.70, 0.80], [0.90, 0.93], [1, 0.72]], 16);
  } else if (key === 'upperArm') {
    g = latheLimb([[0, 0.95], [0.22, 1.0], [0.68, 0.80], [1, 0.66]], 10);
  } else if (key === 'foreArm') {
    g = latheLimb([[0, 0.90], [0.28, 0.96], [1, 0.58]], 10);
  } else if (key === 'thigh') {
    g = latheLimb([[0, 0.90], [0.24, 1.0], [0.72, 0.78], [1, 0.64]], 12);
  } else if (key === 'shin') {
    g = latheLimb([[0, 0.88], [0.20, 1.0], [0.74, 0.58], [1, 0.42]], 10);
  } else if (key === 'neck') {
    g = latheLimb([[0, 1.0], [1, 0.92]], 10);
  } else if (key === 'wrap') {
    // Open-ended cone: loincloths, skirts, sleeves.
    g = new THREE.CylinderGeometry(1, 1.25, 1, 14, 1, true);
    g.translate(0, -0.5, 0);
  } else if (key === 'band') {
    g = new THREE.TorusGeometry(1, 0.16, 6, 18);
  } else if (key === 'cone') {
    g = new THREE.ConeGeometry(1, 1, 8);
    g.translate(0, 0.5, 0);
  } else {
    throw new Error('unknown body geometry ' + key);
  }
  HUMAN_GEO[key] = g;
  return g;
}

const HUMAN_MATS = {};
function skinMat(key) {
  const id = 'skin:' + key;
  if (!HUMAN_MATS[id]) {
    const s = surfaceTiled(key, [1.4, 2.2]);
    HUMAN_MATS[id] = new THREE.MeshStandardMaterial({
      map: s.map,
      normalMap: s.normalMap,
      roughnessMap: s.roughnessMap,
      normalScale: new THREE.Vector2(0.45, 0.45),
      roughness: 0.72,
      metalness: 0,
      envMapIntensity: 0.35,
      // Lathed parts are only right-side-out if the profile winding is right;
      // double-siding them costs almost nothing at this size and removes any
      // chance of a limb turning inside out.
      side: THREE.DoubleSide,
    });
  }
  return HUMAN_MATS[id];
}

function clothMat(hex, surfKey) {
  const id = 'cloth:' + (surfKey || 'cloth') + ':' + hex;
  if (!HUMAN_MATS[id]) {
    const s = grainTiled(surfKey || 'cloth', [2.2, 2.2]);
    HUMAN_MATS[id] = new THREE.MeshStandardMaterial({
      map: s.map,
      normalMap: s.normalMap,
      roughnessMap: s.roughnessMap,
      color: hex,
      roughness: 0.92,
      metalness: 0,
      envMapIntensity: 0.2,
      side: THREE.DoubleSide,
    });
  }
  return HUMAN_MATS[id];
}

// Animal pelts: the same lathed parts as the people, wearing a directional
// strand texture instead of skin.
function furMat(key) {
  const id = 'fur:' + key;
  if (!HUMAN_MATS[id]) {
    const sf = surfaceTiled(key, [2.6, 2.6]);
    HUMAN_MATS[id] = new THREE.MeshStandardMaterial({
      map: sf.map,
      normalMap: sf.normalMap,
      roughnessMap: sf.roughnessMap,
      normalScale: new THREE.Vector2(0.8, 0.8),
      roughness: 0.9,
      metalness: 0,
      envMapIntensity: 0.2,
      side: THREE.DoubleSide,
    });
  }
  return HUMAN_MATS[id];
}

function plainMat(id, opts) {
  if (!HUMAN_MATS[id]) HUMAN_MATS[id] = new THREE.MeshStandardMaterial(opts);
  return HUMAN_MATS[id];
}
function hairMat(hex) {
  return plainMat('hair:' + hex, { color: hex, roughness: 0.62, metalness: 0 });
}

// ---------- One arm ----------
// The group the caller animates is the shoulder. Inside it the forearm sits in
// its own group with a fixed slight bend, so the arm has an elbow instead of
// being a single straight stick.
function HumanArm({ groupRef, side, skinKey, bandColor, face, weapon, detail }) {
  const sx = side * BODY.shoulderX;
  const bend = -face * 0.16;
  return html`
    <group ref=${groupRef} position=${[sx, BODY.shoulderY, 0]}>
      <mesh geometry=${humanGeo('ball')} material=${skinMat(skinKey)}
        position=${[0, 0.01, 0]} scale=${[0.082, 0.075, 0.082]} castShadow=${true} />
      <mesh geometry=${humanGeo('upperArm')} material=${skinMat(skinKey)}
        position=${[0, 0, 0]} scale=${[0.072, BODY.upperArm, 0.072]} castShadow=${true} />
      ${detail > 0 && bandColor && html`
        <mesh geometry=${humanGeo('band')} material=${clothMat(bandColor)}
          position=${[0, -BODY.upperArm * 0.55, 0]} rotation=${[Math.PI / 2, 0, 0]}

function Player() {
  const { camera, gl } = useThree();
  const group = useRef();
  const leftArm = useRef();
  const rightArm = useRef();
  const leftLeg = useRef();
  const rightLeg = useRef();
  const bodyVisual = useRef();
  const fpWeapon = useRef();
  const fpWeaponAnim = useRef();

  const yaw = useRef(0);
  const pitch = useRef(-0.18);
  const velocityY = useRef(0);
  const onGround = useRef(true);
  const camDistance = useRef(6);
  const cameraMode = useRef('third'); // 'third' | 'first'
  const limbPhase = useRef(0);
  const statTimer = useRef(0);
  const lastNearId = useRef(null);
  const inWater = useRef(false);
  const attackTimer = useRef(0);
  const mpSendTimer = useRef(0);
  const deathTimer = useRef(0); // seconds since death, drives the collapse animation
  const camDistanceBeforeDeath = useRef(null); // the player's own zoom, restored on respawn
  const camBase = useRef(new THREE.Vector3()); // camera position before screen shake

  const equippedWeaponId = useGame((s) => {
    const slot = s.hotbarSlots[s.activeHotbarSlot];
    return WEAPONS[slot] && (s.inventory[slot] || 0) > 0 ? slot : null;
  });

  const mpRole = useGame((s) => s.mpRole);
  useEffect(() => {
    if (mpRole === 'joiner' && group.current) {
      group.current.position.set(FRIEND_BASE_CENTER[0], getTerrainHeight(FRIEND_BASE_CENTER[0], FRIEND_BASE_CENTER[2]), FRIEND_BASE_CENTER[2]);
      velocityY.current = 0;
    }
  }, [mpRole]);

  // Respawn: put the body back on its feet at camp and undo the collapse pose.
  // Keyed on deathCount so it fires once per respawn, not on the initial mount.
  const deathCount = useGame((s) => s.deathCount);
  useEffect(() => {
    if (deathCount === 0 || !group.current) return;
    const home = mpRole === 'joiner' ? FRIEND_BASE_CENTER : PLAYER_SPAWN;
    group.current.position.set(home[0], getTerrainHeight(home[0], home[2]), home[2]);
    velocityY.current = 0;
    deathTimer.current = 0;
    if (camDistanceBeforeDeath.current !== null) {
      camDistance.current = camDistanceBeforeDeath.current;
      camDistanceBeforeDeath.current = null;
    }
    if (bodyVisual.current) {
      bodyVisual.current.rotation.set(0, 0, 0);
      bodyVisual.current.position.set(0, 0, 0);
    }
    for (const limb of [leftArm, rightArm, leftLeg, rightLeg]) {
      if (limb.current) limb.current.rotation.set(0, 0, 0);
    }
  }, [deathCount, mpRole]);

  useEffect(() => {
    const canvas = gl.domElement;
    // Camera look is a middle-mouse drag: hold the wheel button and move the mouse.
    // That leaves the left button free for attacking and the cursor free for the HUD,
    // so the game never silently swallows the pointer.
    const looking = { active: false };
    const stopLooking = () => {
      if (!looking.active) return;
      looking.active = false;
      if (document.pointerLockElement === canvas && document.exitPointerLock) document.exitPointerLock();
    };
    const onMouseMove = (e) => {
      if (!looking.active) return;
      const sens = 0.0022 * inputSettings.lookSens;
      yaw.current -= e.movementX * sens;
      pitch.current -= e.movementY * sens * (inputSettings.invertY ? -1 : 1);
      pitch.current = Math.max(-1.2, Math.min(0.9, pitch.current));
    };
    const onWheel = (e) => {
      camDistance.current = Math.max(2, Math.min(12, camDistance.current + e.deltaY * 0.01));
    };
    // Throw the equipped spear, or swing whatever melee weapon is in hand.
    // Shared by the left mouse button and the on-screen attack button.
    const doAttack = () => {
      const s = useGame.getState();
      if (s.activePanel !== null || s.dead) return;
      const slot = s.hotbarSlots[s.activeHotbarSlot];
      const weapon = WEAPONS[slot];
      if (!weapon || (s.inventory[slot] || 0) <= 0) return;
      attackTimer.current = ATTACK_DURATION;
      if (weapon.throwable) s.throwWeapon(slot);
      else { s.meleeAttack(slot); triggerWeaponFx(slot); }
      mpSend({ t: 'attack' });
    };
    const onMouseDown = (e) => {
      if (useGame.getState().activePanel !== null) return;
      if (e.button === 1) {
        // Middle button: start looking. preventDefault stops middle-click autoscroll.
        e.preventDefault();
        looking.active = true;
        // Pointer lock makes the drag unbounded and hides the cursor for the duration;
        // if the browser refuses it, movementX/Y still drive the look unlocked.
        if (canvas.requestPointerLock) canvas.requestPointerLock();
        return;
      }
      if (e.button === 0) doAttack();
    };
    const onMouseUp = (e) => {
      if (e.button === 1) stopLooking();
    };
    // If the lock drops for any other reason (Esc, tab switch), stop looking too,
    // otherwise the next mouse move would keep spinning the camera.
    const onPointerLockChange = () => {
      if (looking.active && document.pointerLockElement !== canvas) looking.active = false;
    };
    touchInput.attack = doAttack;

    // ---- touch: drag-to-look anywhere on the canvas ----
    const activeLookTouch = { id: null, x: 0, y: 0 };
    const onTouchStart = (e) => {
      if (useGame.getState().activePanel !== null) return;
      if (activeLookTouch.id !== null) return;
      const t = e.changedTouches[0];
      activeLookTouch.id = t.identifier;
      activeLookTouch.x = t.clientX;
      activeLookTouch.y = t.clientY;
    };
    const onTouchMove = (e) => {
      for (const t of e.changedTouches) {
        if (t.identifier === activeLookTouch.id) {
          touchInput.lookDX += t.clientX - activeLookTouch.x;
          touchInput.lookDY += t.clientY - activeLookTouch.y;
          activeLookTouch.x = t.clientX;
          activeLookTouch.y = t.clientY;
        }
      }
    };
    const onTouchEnd = (e) => {
      for (const t of e.changedTouches) {
        if (t.identifier === activeLookTouch.id) activeLookTouch.id = null;
      }
    };

    document.addEventListener('mousemove', onMouseMove);
    canvas.addEventListener('wheel', onWheel, { passive: true });
    // mousedown is non-passive so the middle button can cancel browser autoscroll.
    canvas.addEventListener('mousedown', onMouseDown);
    // mouseup on the window, so releasing outside the canvas still ends the look.
    window.addEventListener('mouseup', onMouseUp);
    window.addEventListener('blur', stopLooking);
    document.addEventListener('pointerlockchange', onPointerLockChange);
    canvas.addEventListener('touchstart', onTouchStart, { passive: true });
    canvas.addEventListener('touchmove', onTouchMove, { passive: true });
    canvas.addEventListener('touchend', onTouchEnd, { passive: true });
    canvas.addEventListener('touchcancel', onTouchEnd, { passive: true });

    const offPress = onKeyPress((code) => {
      const s = useGame.getState();

      // Esc is reserved and unbindable: it always just closes what's open.
      if (code === 'Escape') {
        if (s.activePanel) s.setActivePanel(null);
        return;
      }

      const action = actionForCode(code);
      if (!action) return;

      // Dead players can look around and open the map or settings, nothing else.
      if (s.dead && action !== 'camera' && action !== 'map' && action !== 'settings') return;

      if (action === 'camera') {
        cameraMode.current = cameraMode.current === 'third' ? 'first' : 'third';
      }
      if (action === 'inventory') {
        s.setActivePanel(s.activePanel === 'inventory' ? null : 'inventory');
      }
      if (action === 'interact' || action === 'craft') {
        // Pressing the same key again closes the panel it opened.
        if (s.activePanel) {
          s.setActivePanel(null);
        } else {
          const near = s.nearInteractable;
          if (near && near.action === action) near.onInteract();
        }
      }
      if (action === 'gather' && !s.activePanel) {
        const near = s.nearInteractable;
        if (near && near.action === 'gather') {
          near.onInteract();
        } else if (inWater.current) {
          s.adjustStat('thirst', 35);
          s.addToast('Drank water (+35 thirst)');
        }
      }
      if (action === 'cycleHotbar') {
        s.setActiveHotbarSlot((s.activeHotbarSlot + 1) % s.hotbarSlots.length);
      }
      if (action === 'build') {
        s.setActivePanel(s.activePanel === 'build' ? null : 'build');
      }
      if (action === 'map') {
        s.setActivePanel(s.activePanel === 'map' ? null : 'map');
      }
      if (action === 'settings') {
        s.setActivePanel(s.activePanel === 'settings' ? null : 'settings');
      }
      if (action === 'tribe') {
        s.setActivePanel(s.activePanel === 'tribe' ? null : 'tribe');
      }
      if (action === 'chat' && !s.activePanel) {
        s.setChatOpen(true);
        if (document.exitPointerLock) document.exitPointerLock();
      }
      // Poke/stab with the equipped weapon without throwing it.
      if (action === 'poke' && !s.activePanel) {
        const slot = s.hotbarSlots[s.activeHotbarSlot];
        const weapon = WEAPONS[slot];
        if (weapon && (s.inventory[slot] || 0) > 0) {
          attackTimer.current = ATTACK_DURATION;
          s.meleeAttack(slot);
          triggerWeaponFx(slot);
          mpSend({ t: 'attack' });
        }
      }
    });

    // Any panel opening hands the cursor back and ends a middle-drag look, so the
    // camera can't keep spinning while the player is clicking around a panel.
    const unsub = useGame.subscribe((state, prev) => {
      if (state.activePanel !== prev.activePanel && state.activePanel !== null) {
        stopLooking();
      }
    });

    return () => {
      document.removeEventListener('mousemove', onMouseMove);
      canvas.removeEventListener('wheel', onWheel);
      canvas.removeEventListener('mousedown', onMouseDown);
      window.removeEventListener('mouseup', onMouseUp);
      window.removeEventListener('blur', stopLooking);
      document.removeEventListener('pointerlockchange', onPointerLockChange);
      canvas.removeEventListener('touchstart', onTouchStart);
      canvas.removeEventListener('touchmove', onTouchMove);
      canvas.removeEventListener('touchend', onTouchEnd);
      canvas.removeEventListener('touchcancel', onTouchEnd);
      offPress();
      unsub();
      touchInput.attack = () => {};
    };
  }, [gl]);

  useFrame((_, rawDelta) => {
    const delta = Math.min(rawDelta, 0.1);
    const s = useGame.getState();
    const dead = s.dead;
    // A dead player is frozen exactly as an open panel freezes them: no walking, no
    // jumping, no looking. Gravity still runs so the body settles onto the ground.
    const panelOpen = panelBlocksMovement(s.activePanel) || dead;
    const pos = group.current.position;

    // ---- input ----
    let moveX = 0;
    let moveZ = 0;
    if (!panelOpen) {
      if (keyHeld('moveForward')) moveZ -= 1;
      if (keyHeld('moveBack')) moveZ += 1;
      if (keyHeld('moveLeft')) moveX -= 1;
      if (keyHeld('moveRight')) moveX += 1;

      // ---- virtual joystick (touch) ----
      moveX += touchInput.moveX;
      moveZ += touchInput.moveZ;

      // ---- look keys: turn the camera without the mouse ----
      const lookSpeed = 1.6 * inputSettings.lookSens; // radians/sec
      const lookY = inputSettings.invertY ? -1 : 1;
      if (keyHeld('lookLeft')) yaw.current += lookSpeed * delta;
      if (keyHeld('lookRight')) yaw.current -= lookSpeed * delta;
      if (keyHeld('lookUp')) pitch.current += lookSpeed * delta * lookY;
      if (keyHeld('lookDown')) pitch.current -= lookSpeed * delta * lookY;
      pitch.current = Math.max(-1.2, Math.min(0.9, pitch.current));
    }

    // ---- touch drag-to-look ----
    if (touchInput.lookDX !== 0 || touchInput.lookDY !== 0) {
      yaw.current -= touchInput.lookDX * 0.0028;
      pitch.current -= touchInput.lookDY * 0.0028;
      pitch.current = Math.max(-1.2, Math.min(0.9, pitch.current));
      touchInput.lookDX = 0;
      touchInput.lookDY = 0;
    }
    const moving = moveX !== 0 || moveZ !== 0;
    const crouching = !panelOpen && keyHeld('crouch');
    const sprinting = !panelOpen && !crouching && moving && keyHeld('sprint') && s.stats.energy > 1;

    // ---- water check ----
    const dxw = pos.x - POND_CENTER[0];
    const dzw = pos.z - POND_CENTER[1];
    const swimming = Math.hypot(dxw, dzw) < POND_RADIUS;
    inWater.current = swimming;

    // ---- speed / meter multiplier ----
    let speed = WALK_SPEED;
    let meterMult = 1;
    if (crouching) {
      speed *= CROUCH_MULT;
      meterMult = 1;
    } else if (sprinting) {
      speed *= SPRINT_MULT;
      meterMult = 1.5;
    }
    if (swimming) {
      speed *= 0.6;
      meterMult = 2;
    }

    // ---- movement ----
    let moved = 0;
    if (moving) {
      const len = Math.hypot(moveX, moveZ) || 1;
      const fwdInput = -moveZ / len; // W = forward
      const rightInput = moveX / len; // D = right

      const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(UP, yaw.current);
      const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(UP, yaw.current);

      const dirX = forward.x * fwdInput + right.x * rightInput;
      const dirZ = forward.z * fwdInput + right.z * rightInput;
      const dirLen = Math.hypot(dirX, dirZ) || 1;

      const stepX = (dirX / dirLen) * speed * delta;
      const stepZ = (dirZ / dirLen) * speed * delta;
      const dep = s.depletedNodes;
      const _now = Date.now();
      // Axis-separated collision so the player can slide along obstacles
      const nx = pos.x + stepX;
      let colX = false;
      for (const o of STATIC_OBSTACLES) {
        if (dep[o.id] && dep[o.id] > _now) continue;
        if (Math.hypot(nx - o.x, pos.z - o.z) < o.r + PLAYER_COLL_R) { colX = true; break; }
      }
      if (!colX && remotePlayer.active) {
        const [rx,,rz] = remotePlayer.position;
        if (Math.hypot(nx - rx, pos.z - rz) < 0.45 + PLAYER_COLL_R) colX = true;
      }
      const nz = pos.z + stepZ;
      let colZ = false;
      for (const o of STATIC_OBSTACLES) {
        if (dep[o.id] && dep[o.id] > _now) continue;
        if (Math.hypot(pos.x - o.x, nz - o.z) < o.r + PLAYER_COLL_R) { colZ = true; break; }
      }
      if (!colZ && remotePlayer.active) {
        const [rx,,rz] = remotePlayer.position;
        if (Math.hypot(pos.x - rx, nz - rz) < 0.45 + PLAYER_COLL_R) colZ = true;
      }
      if (!colX) pos.x = nx;
      if (!colZ) pos.z = nz;
      moved = Math.hypot(colX ? 0 : stepX, colZ ? 0 : stepZ);

      // face movement direction
      group.current.rotation.y = Math.atan2(dirX / dirLen, dirZ / dirLen);

      limbPhase.current += delta * speed * 2.2;
      const swing = Math.sin(limbPhase.current) * (crouching ? 0.3 : 0.6);
      if (leftArm.current) leftArm.current.rotation.x = swing;
      if (rightArm.current) rightArm.current.rotation.x = -swing;
      if (leftLeg.current) leftLeg.current.rotation.x = -swing;
      if (rightLeg.current) rightLeg.current.rotation.x = swing;
    } else {
      const settle = Math.sin(limbPhase.current) * 0.05;
      if (leftArm.current) leftArm.current.rotation.x *= 0.9;
      if (rightArm.current) rightArm.current.rotation.x *= 0.9;
      if (leftLeg.current) leftLeg.current.rotation.x *= 0.9;
      if (rightLeg.current) rightLeg.current.rotation.x *= 0.9;
    }

    if (moved > 0) {
      s.addMeters(moved * meterMult);
    }

    // ---- attack swing animation (overrides walk-cycle arm pose) ----
    if (attackTimer.current > 0) {
      attackTimer.current = Math.max(0, attackTimer.current - delta);
      const progress = 1 - attackTimer.current / ATTACK_DURATION;
      if (rightArm.current) rightArm.current.rotation.x = -Math.sin(progress * Math.PI) * 1.8;
    }

    // ---- first-person weapon view-model: walk bob + poke animation ----
    if (fpWeaponAnim.current) {
      const bobActive = moving && onGround.current && !swimming;
      const bobAmp = sprinting ? 0.09 : 0.05;
      const targetBobX = bobActive ? Math.sin(limbPhase.current) * bobAmp * 0.4 : 0;
      const targetBobY = bobActive ? Math.abs(Math.sin(limbPhase.current)) * bobAmp : 0;

      let pokeOffsetZ = 0;
      let pokeRotX = 0;
      if (attackTimer.current > 0) {
        const progress = 1 - attackTimer.current / ATTACK_DURATION;
        pokeOffsetZ = -Math.sin(progress * Math.PI) * 0.35;
        pokeRotX = -Math.sin(progress * Math.PI) * 0.5;
      }

      const anim = fpWeaponAnim.current;
      anim.position.x += (targetBobX - anim.position.x) * 0.2;
      anim.position.y += (targetBobY - anim.position.y) * 0.2;
      anim.position.z += (pokeOffsetZ - anim.position.z) * 0.5;
      anim.rotation.x += (pokeRotX - anim.rotation.x) * 0.5;
    }

    // ---- crouch height ----
    const targetScaleY = crouching ? 0.72 : 1;
    if (bodyVisual.current) {
      bodyVisual.current.scale.y += (targetScaleY - bodyVisual.current.scale.y) * 0.2;
    }

    // ---- death: topple over and go slack ----
    if (dead) {
      deathTimer.current += delta;
      const t = Math.min(1, deathTimer.current / DEATH_FALL_TIME);
      const fall = 1 - Math.pow(1 - t, 3); // easeOutCubic, so it drops then settles
      if (bodyVisual.current) {
        // The group's pivot is at the feet, so rolling about z lays the body down.
        bodyVisual.current.rotation.z = fall * Math.PI * 0.48;
        bodyVisual.current.rotation.y = fall * 0.35;
        bodyVisual.current.position.y = -fall * 0.22;
        bodyVisual.current.scale.y += (1 - bodyVisual.current.scale.y) * 0.2;
      }
      // Limbs flop rather than holding the walk pose.
      if (leftArm.current) leftArm.current.rotation.x = -fall * 1.0;
      if (rightArm.current) rightArm.current.rotation.x = fall * 0.6;
      if (leftLeg.current) leftLeg.current.rotation.x = fall * 0.45;
      if (rightLeg.current) rightLeg.current.rotation.x = -fall * 0.3;
      // Always third person on death, pulled back a little, so you watch yourself fall.
      // The player's own zoom is remembered and handed back on respawn.
      if (camDistanceBeforeDeath.current === null) camDistanceBeforeDeath.current = camDistance.current;
      cameraMode.current = 'third';
      camDistance.current += (7.5 - camDistance.current) * 0.05;
    }

    // ---- gravity / jump / swim float ----
    if (swimming) {
      velocityY.current = 0;
      // Float just under the surface, but never below the pond floor — otherwise the
      // player's legs disappear through the ground in the shallows at the rim.
      const floorY = getTerrainHeight(pos.x, pos.z);
      const targetY = Math.max(floorY, POND_SURFACE_Y - SWIM_SUBMERSION);
      pos.y += (targetY - pos.y) * 0.1;
      onGround.current = true;
    } else {
      if (keyHeld('jump') && onGround.current && !panelOpen) {
        velocityY.current = JUMP_SPEED;
        onGround.current = false;
      }
      velocityY.current -= GRAVITY * delta;
      pos.y += velocityY.current * delta;
      const groundY = getTerrainHeight(pos.x, pos.z);
      if (pos.y <= groundY) {
        pos.y = groundY;
        velocityY.current = 0;
        onGround.current = true;
      }
    }

    // ---- camera ----
    // camBase holds the camera's unshaken position. The third-person view smooths
    // towards its target by lerping from where the camera already is, so if the shake
    // offset were written straight onto camera.position it would feed back into the
    // next frame's lerp and drag the camera around instead of just rattling it.
    if (camBase.current.lengthSq() === 0) camBase.current.copy(camera.position);
    const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(UP, yaw.current);
    if (cameraMode.current === 'third') {
      const dist = camDistance.current;
      const camPos = pos.clone();
      camPos.x -= forward.x * dist * Math.cos(pitch.current);
      camPos.z -= forward.z * dist * Math.cos(pitch.current);
      camPos.y += 1.6 + Math.sin(pitch.current) * dist * -1 + dist * 0.5;
      camPos.y = Math.max(camPos.y, getTerrainHeight(camPos.x, camPos.z) + 0.5);
      camBase.current.lerp(camPos, 0.25);
      camera.position.copy(camBase.current);
      // Aimed from the base position, so the shake stays a pure translation rather
      // than the look-at quietly cancelling it out.
      camera.lookAt(pos.x, pos.y + (dead ? 0.6 : 1.4), pos.z);
      bodyVisual.current && (bodyVisual.current.visible = true);
    } else {
      camBase.current.set(pos.x, pos.y + 1.6, pos.z);
      camera.position.copy(camBase.current);
      camera.rotation.order = 'YXZ';
      camera.rotation.y = yaw.current;
      camera.rotation.x = pitch.current;
      camera.rotation.z = 0;
      bodyVisual.current && (bodyVisual.current.visible = false);
    }

    // ---- screen shake from taking a hit ----
    // After the camera is placed and aimed, but before the first-person weapon reads
    // camera.position below, so the held weapon rattles along with the view.
    applyScreenShake(camera, delta);

    // ---- first-person held weapon view-model ----
    if (fpWeapon.current) {
      if (cameraMode.current === 'first' && equippedWeaponId) {
        fpWeapon.current.visible = true;
        fpWeapon.current.quaternion.copy(camera.quaternion);
        const handOffset = new THREE.Vector3(0.35, -0.32, -0.5).applyQuaternion(camera.quaternion);
        fpWeapon.current.position.copy(camera.position).add(handOffset);
      } else {
        fpWeapon.current.visible = false;
      }
    }

    // ---- survival stat ticking ----
    // Skipped while dead: the regen branch below would otherwise lift health back off
    // zero and leave the player walking around flagged as dead.
    if (!dead) {
      statTimer.current += delta;
      if (sprinting) s.adjustStat('energy', -delta * 6);
      if (statTimer.current > 1) {
        statTimer.current = 0;
        s.adjustStat('hunger', -0.08);
        s.adjustStat('thirst', -0.12);
        if (!sprinting) s.adjustStat('energy', crouching ? 0.5 : 1);
        if (s.stats.hunger <= 0 || s.stats.thirst <= 0) s.adjustStat('health', -1);
        else if (s.stats.health < 100) s.adjustStat('health', 0.2);
        // night drains warmth slowly
        const t = s.timeOfDay;
        if (t < 5 || t > 20) s.adjustStat('warmth', -0.6);
        else s.adjustStat('warmth', 0.4);
      }
    }

    // ---- share transform for building placement ----
    playerTransform.position[0] = pos.x;
    playerTransform.position[1] = pos.y;
    playerTransform.position[2] = pos.z;
    playerTransform.yaw = yaw.current;

    // ---- nearby interactables ----
    const near = findNearest([pos.x, pos.y, pos.z]);
    const nearId = near ? near.id : null;
    if (nearId !== lastNearId.current) {
      lastNearId.current = nearId;
      s.setNearInteractable(near);
    }

    s.tickRespawns();

    // ---- multiplayer: broadcast our transform a few times a second ----
    mpSendTimer.current += delta;
    if (mpSendTimer.current > 0.08) {
      mpSendTimer.current = 0;
      mpSend({
        t: 'state',
        position: [pos.x, pos.y, pos.z],
        yaw: group.current.rotation.y,
        moving,
        sprinting,
        crouching,
        equippedWeaponId,
      });

      // Host: keep the joiner's rival tribe camps in sync (positions, health, captures).
      if (s.mpRole === 'host') {
        mpSend({
          t: 'tribeSync',
          members: tribeMemberSyncData,
          tribeMemberState: s.tribeMemberState,
          capturedTribes: s.capturedTribes,
          activeTribeIds: s.activeTribeIds,
          raid: s.raid,
          distantRaid: s.distantRaid,
          interTribalRaid: s.interTribalRaid,
        });
      }
    }
  });

  return html`
    <${Fragment}>
    <group ref=${group} position=${[0, 0, 8]}>
      <${ContactShadow} radius=${0.44} />
      <group ref=${bodyVisual}>
        <${HumanFigure}
          skinKey="skinPale"
          clothColor="#3f6b8a"
          accentColor="#8a6a3c"
          hairColor="#2b1b10"
          armL=${leftArm} armR=${rightArm}
          legL=${leftLeg} legR=${rightLeg}
          weapon=${equippedWeaponId || null}
          face=${-1}
          torsoWrap=${true}
        />
      </group>
    </group>
    <group ref=${fpWeapon} visible=${false}>
      <group ref=${fpWeaponAnim}>
        <group rotation=${[0, Math.PI, 0]}>
          ${equippedWeaponId && html`<${HeldWeapon} id=${equippedWeaponId} />`}
        </group>
      </group>
    </group>
    <//>
  `;
}

// ============================================================
// RemotePlayer.js - visual representation of the other player (P2P multiplayer)
// ============================================================
function RemotePlayer() {
  const group = useRef();
  const leftArm = useRef();
  const rightArm = useRef();
  const leftLeg = useRef();
  const rightLeg = useRef();
  const limbPhase = useRef(0);
  const attackTimer = useRef(0);
  const lastAttackSeq = useRef(0);
  const [visible, setVisible] = useState(false);
  const [weaponId, setWeaponId] = useState(null);

  useFrame((_, rawDelta) => {
    const delta = Math.min(rawDelta, 0.1);
    if (!remotePlayer.active) {
      if (visible) setVisible(false);
      return;
    }
    if (!visible) setVisible(true);
    if (remotePlayer.equippedWeaponId !== weaponId) setWeaponId(remotePlayer.equippedWeaponId);

    const g = group.current;
    const [tx, ty, tz] = remotePlayer.position;
    g.position.x += (tx - g.position.x) * 0.25;
    g.position.y += (ty - g.position.y) * 0.25;
    g.position.z += (tz - g.position.z) * 0.25;

    let yawDiff = remotePlayer.yaw - g.rotation.y;
    while (yawDiff > Math.PI) yawDiff -= Math.PI * 2;
    while (yawDiff < -Math.PI) yawDiff += Math.PI * 2;
    g.rotation.y += yawDiff * 0.25;

    if (remotePlayer.attackSeq !== lastAttackSeq.current) {
      lastAttackSeq.current = remotePlayer.attackSeq;
      attackTimer.current = ATTACK_DURATION;
    }

    if (remotePlayer.moving) {
      const speedFactor = remotePlayer.sprinting ? 2.2 : remotePlayer.crouching ? 1.0 : 1.6;
      limbPhase.current += delta * speedFactor * 2.2;
      const swing = Math.sin(limbPhase.current) * (remotePlayer.crouching ? 0.3 : 0.6);
      if (leftArm.current) leftArm.current.rotation.x = swing;
      if (rightArm.current) rightArm.current.rotation.x = -swing;
      if (leftLeg.current) leftLeg.current.rotation.x = -swing;
      if (rightLeg.current) rightLeg.current.rotation.x = swing;
    } else {
      if (leftArm.current) leftArm.current.rotation.x *= 0.9;
      if (rightArm.current) rightArm.current.rotation.x *= 0.9;
      if (leftLeg.current) leftLeg.current.rotation.x *= 0.9;
      if (rightLeg.current) rightLeg.current.rotation.x *= 0.9;
    }

    if (attackTimer.current > 0) {
      attackTimer.current -= delta;
      const progress = 1 - attackTimer.current / ATTACK_DURATION;
      if (rightArm.current) rightArm.current.rotation.x = -Math.sin(progress * Math.PI) * 1.8;
    }
  });

  return html`
    <group ref=${group} visible=${visible} position=${[remotePlayer.position[0], remotePlayer.position[1], remotePlayer.position[2]]}>
      <${ContactShadow} radius=${0.44} />
      <${HumanFigure}
        skinKey="skinPale"
        clothColor="#c9a020"
        accentColor="#f0d020"
        hairColor="#3a2415"
        armL=${leftArm} armR=${rightArm}
        legL=${leftLeg} legR=${rightLeg}
        weapon=${weaponId || null}
        face=${-1}
        torsoWrap=${true}
      />
    </group>
  `;
}

// ============================================================
// Resources.js - gatherable resource nodes
// ============================================================
function OreNode({ position, color }) {
  const y = getTerrainHeight(position[0], position[2]);
  return html`
    <group position=${[position[0], y, position[2]]}>
      <mesh position=${[0, 0.28, 0]} castShadow=${true}>
        <dodecahedronGeometry args=${[0.34, 0]} />
        <meshStandardMaterial color=${color} metalness=${0.7} roughness=${0.25} flatShading=${true} />
      </mesh>
      <mesh position=${[0.3, 0.16, 0.2]} castShadow=${true}>
        <dodecahedronGeometry args=${[0.2, 0]} />
        <meshStandardMaterial color=${color} metalness=${0.7} roughness=${0.25} flatShading=${true} />
      </mesh>
      <mesh position=${[-0.22, 0.14, -0.18]} castShadow=${true}>
        <dodecahedronGeometry args=${[0.16, 0]} />
        <meshStandardMaterial color=${color} metalness=${0.7} roughness=${0.25} flatShading=${true} />
      </mesh>
    </group>
  `;
}

function ResourceNode({ node }) {
  const depleted = useGame((s) => !!s.depletedNodes[node.id]);
  const activeWeapon = useGame((s) => s.hotbarSlots[s.activeHotbarSlot]);
  const hasAxe = useGame((s) => (s.inventory.axe || 0) > 0);
  const hasMachete = useGame((s) => (s.inventory.machete || 0) > 0);
  const hasPickaxe = useGame((s) => (s.inventory.pickaxe || 0) > 0);

  let label;
  if (node.type === 'wood') {
    if (activeWeapon === 'axe' && hasAxe) label = 'Chop Wood (Axe)';
    else if (activeWeapon === 'machete' && hasMachete) label = 'Chop Leaves (Machete)';
    else label = 'Gather Wood (need Axe)';
  } else if (node.type === 'stone') {
    label = (activeWeapon === 'pickaxe' && hasPickaxe) ? 'Mine Stone (Pickaxe)' : 'Mine Stone (need Pickaxe)';
  } else if (node.type === 'silver') {
    label = (activeWeapon === 'pickaxe' && hasPickaxe) ? 'Mine Silver (Pickaxe)' : 'Mine Silver (need Pickaxe)';
  } else if (node.type === 'gold') {
    label = (activeWeapon === 'pickaxe' && hasPickaxe) ? 'Mine Gold (Pickaxe)' : 'Mine Gold (need Pickaxe)';
  } else {
    label = `Gather ${RESOURCES[node.type].name}`;
  }

  useEffect(() => {
    if (depleted) return undefined;
    return registerInteractable({
      id: node.id,
      position: node.position,
      radius: 2.4,
      action: 'gather',
      label,
      onInteract: () => useGame.getState().gatherNode(node),
    });
  }, [depleted, label]);

  if (depleted) return null;

  // Each of these gets a contact shadow as well: they are small enough that
  // the sun's shadow map alone leaves them looking stuck on rather than sat on.
  if (node.type === 'wood') return html`<${Fragment}><${ContactShadow} position=${node.position} radius=${1.3} /><${Tree} position=${node.position} scale=${1.1} /><//>`;
  if (node.type === 'fiber') return html`<${Fragment}><${ContactShadow} position=${node.position} radius=${0.85} /><${Bush} position=${node.position} scale=${1.2} /><//>`;
  if (node.type === 'stone') return html`<${Fragment}><${ContactShadow} position=${node.position} radius=${0.95} /><${Rock} position=${node.position} scale=${1.5} /><//>`;
  if (node.type === 'silver') return html`<${Fragment}><${ContactShadow} position=${node.position} radius=${0.8} /><${OreNode} position=${node.position} color="#c0c0d0" /><//>`;
  if (node.type === 'gold') return html`<${Fragment}><${ContactShadow} position=${node.position} radius=${0.8} /><${OreNode} position=${node.position} color="#ffd700" /><//>`;
  return null;
}

// ---------- A spear in flight, arcing from the player's hand to where it lands ----------
function FlyingSpear({ spear }) {
  const group = useRef();
  const landed = useRef(false);
  const duration = useRef(Math.max(0.15, Math.hypot(spear.end[0] - spear.start[0], spear.end[2] - spear.start[2]) / SPEAR_FLIGHT_SPEED));
  const yaw = Math.atan2(spear.end[0] - spear.start[0], spear.end[2] - spear.start[2]);

  useFrame(() => {
    if (landed.current || !group.current) return;
    const t = Math.min(1, (Date.now() - spear.startedAt) / 1000 / duration.current);
    const x = spear.start[0] + (spear.end[0] - spear.start[0]) * t;
    const z = spear.start[2] + (spear.end[2] - spear.start[2]) * t;
    const arcY = spear.start[1] + (spear.end[1] - spear.start[1]) * t + Math.sin(t * Math.PI) * 1.2;
    const terrY = getTerrainHeight(x, z);
    group.current.position.set(x, Math.max(arcY, terrY + 0.05), z);
    if (t >= 1 || (arcY < terrY + 0.1 && t > 0.05)) {
      landed.current = true;
      useGame.getState().landSpear(spear.id, [x, terrY + 0.05, z]);
    }
  });

  return html`
    <group ref=${group} position=${spear.start} rotation=${[1.5, yaw, 0]}>
      <${HeldWeapon} id=${spear.weaponId} />
    </group>
  `;
}

// ---------- Quick visual "ching" spark burst, e.g. when swinging the machete ----------
function ChingFx({ fx }) {
  const group = useRef();
  const t = useRef(0);
  const DURATION = 0.25;

  useFrame((_, rawDelta) => {
    const delta = Math.min(rawDelta, 0.1);
    t.current += delta;
    if (t.current >= DURATION) {
      useGame.getState().removeFx(fx.id);
      return;
    }
    const k = t.current / DURATION;
    if (group.current) {
      const scale = 0.4 + k * 1.4;
      group.current.scale.set(scale, scale, scale);
      for (const child of group.current.children) {
        if (child.material) child.material.opacity = 1 - k;
      }
    }
  });

  return html`
    <group ref=${group} position=${fx.position}>
      ${[0, 1, 2, 3].map((i) => html`
        <mesh key=${i} rotation=${[0, 0, (i / 4) * Math.PI * 2]}>
          <planeGeometry args=${[0.6, 0.06]} />
          <meshBasicMaterial color="#fff7c0" transparent=${true} opacity=${1} side=${THREE.DoubleSide} depthWrite=${false} />
        </mesh>
      `)}
    </group>
  `;
}

// ============================================================
// Animals.js - wandering/fleeing wildlife
// ============================================================
const WANDER_RADIUS = 14;
const FLEE_RANGE = 7;

// ---------- Melee swing for tribesfolk and warriors ----------
const ATTACK_SWING_TIME = 0.35; // seconds per swing

// A wind-up-and-chop for a shoulder-pivoted arm, with `p` running 0..1 over the swing.
// The arm hangs along -Y from the shoulder, and these figures face their local +Z, so a
// positive rotation.x lifts the arm up behind them and a negative one sweeps it forward
// through the target. Hence: raise back for the first third, then chop through.
function armChopAngle(p) {
  const windUp = 0.35;
  return p < windUp
    ? (p / windUp) * 0.8
    : 0.8 - ((p - windUp) / (1 - windUp)) * 2.6;
}

// Which weapon a given tribesperson carries. Hashed from their id so it is stable for
// the life of the character instead of changing on every re-render.
const TRIBE_WEAPONS = ['club', 'spear', 'machete', 'axe'];
function weaponForEntity(id) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (Math.imul(h, 31) + id.charCodeAt(i)) | 0;
  return TRIBE_WEAPONS[Math.abs(h) % TRIBE_WEAPONS.length];
}

function useWanderAI(group, spawn, {
  speed = 1.6, fleeSpeed = 5, entityId = null, registryKey = 'animals',
  aggressive = false, aggroRange = FLEE_RANGE, attackRange = 1.8,
  attackSpeed = 0, attackDamage = 0, attackCooldown = 1.2,
  frozen = false, alertTribeId = null, attackArm = null,
}) {
  const state = useRef('idle');
  const timer = useRef(1 + Math.random() * 3);
  const target = useRef(new THREE.Vector3(spawn[0], 0, spawn[2]));
  const phase = useRef(Math.random() * 10);
  const legRefs = useRef([]);
  const attackTimer = useRef(0);
  const swingTimer = useRef(0); // counts down through one melee swing
  const warnedAttack = useRef(false);

  useEffect(() => {
    return () => {
      if (entityId) {
        delete entityRegistry[registryKey][entityId];
        if (registryKey === 'tribeMembers') delete tribeMemberSyncData[entityId];
      }
    };
  }, [entityId, registryKey]);

  useFrame((_, rawDelta) => {
    const delta = Math.min(rawDelta, 0.1);
    if (!group.current) return;
    if (frozen) return; // position is driven by the multiplayer host instead
    const pos = group.current.position;
    if (entityId) {
      entityRegistry[registryKey][entityId] = pos;
      if (registryKey === 'tribeMembers' && useGame.getState().mpRole === 'host') {
        tribeMemberSyncData[entityId] = { position: [pos.x, pos.y, pos.z], yaw: group.current.rotation.y };
      }
    }
    timer.current -= delta;
    attackTimer.current -= delta;
    swingTimer.current -= delta;

    // Measured against the player's own position, never the camera's. In third person
    // the camera trails the player by camDistance (6 by default, up to 12 zoomed out),
    // so using camera.position let tribespeople land hits from metres away and made
    // aggro lopsided — generous behind the player, stingy in front.
    const dx = pos.x - playerTransform.position[0];
    const dz = pos.z - playerTransform.position[2];
    const distToPlayer = Math.hypot(dx, dz);

    // A camp-mate being attacked alerts the whole camp - they rush in from much further away.
    const alertedUntil = alertTribeId ? useGame.getState().alertedCamps[alertTribeId] : 0;
    const effectiveAggroRange = alertedUntil && alertedUntil > Date.now() ? Math.max(aggroRange, CAMP_ALERT_RANGE) : aggroRange;

    if (aggressive && distToPlayer < effectiveAggroRange) {
      state.current = 'attack';
    } else if (!aggressive && distToPlayer < FLEE_RANGE) {
      state.current = 'flee';
    } else if (state.current === 'attack') {
      // lost the player - give up the chase and wander again
      state.current = 'idle';
      timer.current = 1;
      warnedAttack.current = false;
    } else if (timer.current <= 0) {
      state.current = state.current === 'wander' ? 'idle' : 'wander';
      if (state.current === 'wander') {
        const angle = Math.random() * Math.PI * 2;
        const dist = 4 + Math.random() * 8;
        let tx = pos.x + Math.cos(angle) * dist;
        let tz = pos.z + Math.sin(angle) * dist;
        // keep near spawn
        if (Math.hypot(tx - spawn[0], tz - spawn[2]) > WANDER_RADIUS) {
          tx = spawn[0];
          tz = spawn[2];
        }
        target.current.set(tx, 0, tz);
        timer.current = 3 + Math.random() * 4;
      } else {
        timer.current = 1.5 + Math.random() * 3;
      }
    }

    let dirX = 0, dirZ = 0, speedNow = 0;
    if (state.current === 'attack') {
      const len = Math.hypot(dx, dz) || 1;
      if (distToPlayer > attackRange) {
        dirX = -dx / len;
        dirZ = -dz / len;
        speedNow = attackSpeed || speed;
      } else {
        group.current.rotation.y = Math.atan2(-dx / len, -dz / len);
        if (!warnedAttack.current) {
          useGame.getState().addToast('A rival tribesperson attacks you!');
          warnedAttack.current = true;
        }
        if (attackTimer.current <= 0 && attackDamage > 0) {
          useGame.getState().adjustStat('health', -attackDamage);
          attackTimer.current = attackCooldown;
          swingTimer.current = ATTACK_SWING_TIME;
        }
      }
    } else if (state.current === 'flee') {
      const len = Math.hypot(dx, dz) || 1;
      dirX = dx / len;
      dirZ = dz / len;
      speedNow = fleeSpeed;
      if (distToPlayer > FLEE_RANGE * 1.6) {
        state.current = 'idle';
        timer.current = 1;
      }
    } else if (state.current === 'wander') {
      const tx = target.current.x - pos.x;
      const tz = target.current.z - pos.z;
      const d = Math.hypot(tx, tz);
      if (d < 0.3) {
        state.current = 'idle';
        timer.current = 1.5 + Math.random() * 3;
      } else {
        dirX = tx / d;
        dirZ = tz / d;
        speedNow = speed;
      }
    }

    if (speedNow > 0) {
      pos.x += dirX * speedNow * delta;
      pos.z += dirZ * speedNow * delta;
      group.current.rotation.y = Math.atan2(dirX, dirZ);
      phase.current += delta * speedNow * 3;
      const swing = Math.sin(phase.current) * 0.4;
      for (const leg of legRefs.current) {
        if (leg.ref.current) leg.ref.current.rotation.x = leg.sign * swing;
      }
    } else {
      for (const leg of legRefs.current) {
        if (leg.ref.current) leg.ref.current.rotation.x *= 0.9;
      }
    }

    // Melee swing, applied after the walk cycle so it overrides the arm's walk pose.
    // When the swing ends the idle decay above eases the arm back down by itself.
    if (attackArm && attackArm.current && swingTimer.current > 0) {
      attackArm.current.rotation.x = armChopAngle(1 - swingTimer.current / ATTACK_SWING_TIME);
    }

    pos.y = getTerrainHeight(pos.x, pos.z);
  });

  return legRefs;
}

// ============================================================
// Tribes.js - rival tribe camps, wandering tribesfolk and raiders
// ============================================================

// Shared low-poly tribesperson model. Used for both peaceful camp
// members (wander AI) and raiders (march toward the player's base).
// Arms hang from shoulder pivots so they can be animated. Pass armL/armR refs to have
// the walk cycle swing them (and the attack chop drive the weapon arm); without refs
// they just hang at the sides. `weapon` is a HeldWeapon id, carried in the right hand —
// turned 180 degrees because HeldWeapon is modelled for the player, who faces -Z, while
// these figures face +Z.

// ---------- Hostile tribe member: wanders near its camp, attacks if the player gets close ----------
function TribeMember({ id, spawn, color }) {
  const alive = useGame((s) => s.tribeMemberState[id]?.alive ?? true);
  const isJoiner = useGame((s) => s.mpRole === 'joiner');
  const group = useRef();
  const legL = useRef();
  const legR = useRef();
  const armL = useRef();
  const armR = useRef();
  const netPhase = useRef(Math.random() * 10);
  const legRefs = useWanderAI(group, spawn, {
    speed: 1.2, fleeSpeed: 3, entityId: (!isJoiner && alive) ? id : null, registryKey: 'tribeMembers',
    aggressive: true, aggroRange: TRIBE_MEMBER_AGGRO_RANGE, attackRange: TRIBE_MEMBER_ATTACK_RANGE,
    attackSpeed: TRIBE_MEMBER_ATTACK_SPEED, attackDamage: TRIBE_MEMBER_DAMAGE, attackCooldown: TRIBE_MEMBER_ATTACK_COOLDOWN,
    frozen: isJoiner, alertTribeId: id.split('_m')[0], attackArm: armR,
  });

  // Joiner: this member's position/rotation is driven by the host's tribeSync
  // broadcast instead of local wander AI.
  useFrame((_, rawDelta) => {
    if (!isJoiner || !group.current) return;
    const net = remoteTribeMembers[id];
    if (!net) return;
    const delta = Math.min(rawDelta, 0.1);
    const g = group.current;
    const dx = net.position[0] - g.position.x;
    const dz = net.position[2] - g.position.z;
    g.position.x += dx * 0.25;
    g.position.y += (net.position[1] - g.position.y) * 0.25;
    g.position.z += dz * 0.25;
    let yawDiff = net.yaw - g.rotation.y;
    while (yawDiff > Math.PI) yawDiff -= Math.PI * 2;
    while (yawDiff < -Math.PI) yawDiff += Math.PI * 2;
    g.rotation.y += yawDiff * 0.25;
    entityRegistry.tribeMembers[id] = g.position;

    if (Math.hypot(dx, dz) > 0.05) {
      netPhase.current += delta * 4;
      const swing = Math.sin(netPhase.current) * 0.4;
      for (const leg of legRefs.current) if (leg.ref.current) leg.ref.current.rotation.x = leg.sign * swing;
    } else {
      for (const leg of legRefs.current) if (leg.ref.current) leg.ref.current.rotation.x *= 0.9;
    }
  });

  useEffect(() => {
    if (!isJoiner) return undefined;
    return () => { delete entityRegistry.tribeMembers[id]; };
  }, [id, isJoiner]);

  if (!alive) return null;
  // Arms ride the same walk cycle as the legs, with the signs flipped so each arm
  // swings opposite the leg on its side.
  legRefs.current = [
    { ref: legL, sign: 1 },
    { ref: legR, sign: -1 },
    { ref: armL, sign: -1 },
    { ref: armR, sign: 1 },
  ];

  return html`
    <group ref=${group} position=${spawn}>
      <${ContactShadow} radius=${0.42} />
      <${TribalFigure} color=${color} armL=${armL} armR=${armR}
        legL=${legL} legR=${legR} weapon=${weaponForEntity(id)} />
    </group>
  `;
}

// ---------- A rival tribe's camp: tents, totem and a few wandering members ----------
// When captured it becomes a "team" — it keeps its own colour/identity but flies a yellow
// alliance flag; garrison warriors are always the player's yellow.
// Inter-tribal conquests repaint the camp in the conquering tribe's colour.
// ---------- Contact shadows ----------
// A shadow map can only resolve so much, and the first thing it loses is the
// tight dark patch right where something touches the ground. Without it
// everything looks like it is hovering a few centimetres up. This is the old
// trick and still the cheapest one: a soft dark disc, laid flat under the
// object, drawn without writing depth. One geometry and one material shared by
// every single one of them, so the whole effect is one draw state.
let _contactGeo = null;
let _contactMat = null;
function contactShadowGeo() {
  if (!_contactGeo) {
    _contactGeo = new THREE.PlaneGeometry(1, 1);
    _contactGeo.rotateX(-Math.PI / 2);
  }
  return _contactGeo;
}
function contactShadowMat() {
  if (!_contactMat) {
    _contactMat = new THREE.MeshBasicMaterial({
      // buildSoftDisc is white with a soft alpha falloff, so tinting it black
      // gives a blob that fades out at the edge instead of a hard circle.
      map: texFrom(buildSoftDisc(64), [1, 1], false),
      color: '#000000',
      transparent: true,
      opacity: 0.5,
      depthWrite: false,
      toneMapped: false,
    });
  }
  return _contactMat;
}

function ContactShadow({ radius = 0.5, y = 0.05, position = null }) {
  const quality = useGame((s) => s.graphicsQuality);
  if (!(GRAPHICS_PRESETS[quality] || gfx()).contactShadows) return null;
  const at = position ? [position[0], position[1] + y, position[2]] : [0, y, 0];
  return html`<mesh geometry=${contactShadowGeo()} material=${contactShadowMat()}
    position=${at} scale=${[radius * 2, 1, radius * 2]}
    renderOrder=${1} frustumCulled=${true} />`;
}

// ---------- Campfire ----------
// Purely a prop - nothing to pick up, nothing to interact with. It exists
// because a camp with no fire in it looks abandoned, and because a jungle
// night needs one warm thing in it to read as dark. The light itself is not
// here: the fire registers its position and DayNightSystem hands the nearest
// few a light out of a fixed pool, so walking into a valley full of camps can
// never trip a shader recompile.
const FIRE_GEO = {};
function fireGeo(key) {
  if (FIRE_GEO[key]) return FIRE_GEO[key];
  let g;
  if (key === 'ash') {
    g = new THREE.CircleGeometry(1.05, 18);
    g.rotateX(-Math.PI / 2);
  } else if (key === 'stones') {
    // A lumpy torus reads as a ring of stones once the rock normal map is on
    // it, and costs one draw instead of seven.
    g = new THREE.TorusGeometry(0.62, 0.14, 5, 9);
    g.rotateX(Math.PI / 2);
    const pos = g.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      const n = Math.sin(x * 9.1 + z * 7.3) * 0.5 + Math.sin(z * 13.7 - x * 5.1) * 0.5;
      pos.setXYZ(i, x * (1 + n * 0.09), y + n * 0.045, z * (1 + n * 0.09));
    }
    g.computeVertexNormals();
  } else if (key === 'log') {
    g = new THREE.CylinderGeometry(0.052, 0.07, 0.95, 7);
  } else if (key === 'flame') {
    g = new THREE.ConeGeometry(0.21, 0.8, 7, 1, true);
  } else if (key === 'flameInner') {
    g = new THREE.ConeGeometry(0.12, 0.5, 6, 1, true);
  } else if (key === 'glow') {
    g = new THREE.PlaneGeometry(2.6, 2.6);
  } else {
    throw new Error('unknown fire geo ' + key);
  }
  FIRE_GEO[key] = g;
  return g;
}

function fireMat(key) {
  if (key === 'ash') {
    return surfaceMat('fireAsh', 'ground', [2.2, 2.2], {
      color: '#241e18', roughness: 0.98, metalness: 0,
    });
  }
  if (key === 'stones') {
    return surfaceMat('fireStones', 'rock', [2.4, 1.2], {
      color: '#8e8a80', roughness: 0.82, metalness: 0.02, envMapIntensity: 0.5,
    });
  }
  if (key === 'log') {
    return surfaceMat('fireLog', 'bark', [1.2, 2.4], {
      color: '#3a2c20', roughness: 0.92, metalness: 0,
    });
  }
  // The flames and the halo are emissive, not lit: additive, no depth write,
  // and deliberately left out of tone mapping so they stay hot-looking however
  // far the eye-adaptation exposure has drifted.
  if (key === 'flame') {
    return stdMat('fireFlame', () => new THREE.MeshBasicMaterial({
      color: '#ff7a1e', transparent: true, opacity: 0.75,
      blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
      toneMapped: false,
    }));
  }
  if (key === 'flameInner') {
    return stdMat('fireCore', () => new THREE.MeshBasicMaterial({
      color: '#ffd88a', transparent: true, opacity: 0.9,
      blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
      toneMapped: false,
    }));
  }
  if (key === 'glow') {
    return stdMat('fireGlow', () => new THREE.MeshBasicMaterial({
      map: texFrom(buildSoftDisc(64), [1, 1], false),
      color: '#ff8c3a', transparent: true, opacity: 0.42,
      blending: THREE.AdditiveBlending, depthWrite: false,
      toneMapped: false,
    }));
  }
  throw new Error('unknown fire mat ' + key);
}

const FIRE_LOGS = [
  { p: [0.0, 0.2, -0.17], r: [0.95, 0.0, 0.0] },
  { p: [0.16, 0.2, 0.1], r: [-0.48, 0.0, -0.82] },
  { p: [-0.16, 0.2, 0.1], r: [-0.48, 0.0, 0.82] },
];

function Campfire({ id, position, scale = 1 }) {
  const flame = useRef();
  const core = useRef();
  const glow = useRef();
  const phase = useMemo(() => Math.random() * 100, []);
  const px = position[0], py = position[1], pz = position[2];

  useEffect(() => {
    fireRegistry[id] = [px, py, pz];
    return () => { delete fireRegistry[id]; };
  }, [id, px, py, pz]);

  useFrame((state) => {
    const t = state.clock.elapsedTime + phase;
    // Same three-sine recipe the light uses, so the flame and the light it
    // casts breathe together instead of fighting each other.
    const f = 0.82 + 0.14 * Math.sin(t * 11.3) + 0.09 * Math.sin(t * 23.7) + 0.05 * Math.sin(t * 47.0);
    if (flame.current) {
      flame.current.scale.set(0.9 + f * 0.2, f, 0.9 + f * 0.2);
      flame.current.rotation.y = t * 1.6;
      flame.current.position.x = Math.sin(t * 6.1) * 0.025;
      flame.current.position.z = Math.cos(t * 5.3) * 0.025;
    }
    if (core.current) {
      core.current.scale.set(1, 0.85 + f * 0.3, 1);
      core.current.rotation.y = -t * 2.3;
    }
    if (glow.current) {
      // The halo material is shared by every fire in the world, so flickering
      // its opacity would make them all flicker in lockstep. Scale is per-mesh.
      const g = 0.82 + f * 0.26;
      glow.current.scale.set(g, g, 1);
      // Billboard it so it always faces the camera.
      glow.current.quaternion.copy(state.camera.quaternion);
    }
  });

  return html`
    <group position=${[px, py, pz]} scale=${scale}>
      <mesh geometry=${fireGeo('ash')} material=${fireMat('ash')} position=${[0, 0.015, 0]} receiveShadow=${true} />
      <mesh geometry=${fireGeo('stones')} material=${fireMat('stones')} position=${[0, 0.09, 0]}
        castShadow=${true} receiveShadow=${true} />
      ${FIRE_LOGS.map((l, i) => html`
        <mesh key=${i} geometry=${fireGeo('log')} material=${fireMat('log')}
          position=${l.p} rotation=${l.r} castShadow=${true} />
      `)}
      <mesh ref=${glow} geometry=${fireGeo('glow')} material=${fireMat('glow')} position=${[0, 0.5, 0]} renderOrder=${2} />
      <mesh ref=${flame} geometry=${fireGeo('flame')} material=${fireMat('flame')} position=${[0, 0.52, 0]} renderOrder=${3} />
      <mesh ref=${core} geometry=${fireGeo('flameInner')} material=${fireMat('flameInner')} position=${[0, 0.4, 0]} renderOrder=${4} />
    </group>
  `;
}

        </mesh>
        ${captured && html`

// ---------- Loose idle/wander AI for friendly warriors guarding the base ----------
function useGuardWander(group, spawn, speed = 1) {
  const state = useRef('idle');
  const timer = useRef(1 + Math.random() * 3);
  const target = useRef(new THREE.Vector3(spawn[0], 0, spawn[2]));
  const phase = useRef(Math.random() * 10);
  const legRefs = useRef([]);

  useFrame((_, rawDelta) => {
    const delta = Math.min(rawDelta, 0.1);
    if (!group.current) return;
    const pos = group.current.position;
    timer.current -= delta;

    if (timer.current <= 0) {
      state.current = state.current === 'wander' ? 'idle' : 'wander';
      if (state.current === 'wander') {
        const angle = Math.random() * Math.PI * 2;
        const dist = 2 + Math.random() * 4;
        target.current.set(spawn[0] + Math.cos(angle) * dist, 0, spawn[2] + Math.sin(angle) * dist);
        timer.current = 3 + Math.random() * 4;
      } else {
        timer.current = 2 + Math.random() * 3;
      }
    }

    let dirX = 0, dirZ = 0, speedNow = 0;
    if (state.current === 'wander') {
      const tx = target.current.x - pos.x;
      const tz = target.current.z - pos.z;
      const d = Math.hypot(tx, tz);
      if (d < 0.3) {
        state.current = 'idle';
        timer.current = 2 + Math.random() * 3;
      } else {
        dirX = tx / d;
        dirZ = tz / d;
        speedNow = speed;
      }
    }

    if (speedNow > 0) {
      pos.x += dirX * speedNow * delta;
      pos.z += dirZ * speedNow * delta;
      group.current.rotation.y = Math.atan2(dirX, dirZ);
      phase.current += delta * speedNow * 3;
      const swing = Math.sin(phase.current) * 0.4;
      for (const leg of legRefs.current) {
        if (leg.ref.current) leg.ref.current.rotation.x = leg.sign * swing;
      }
    } else {
      for (const leg of legRefs.current) {
        if (leg.ref.current) leg.ref.current.rotation.x *= 0.9;
      }
    }
    pos.y = getTerrainHeight(pos.x, pos.z);
  });

  return legRefs;
}

// ---------- A recruited warrior, stands guard and patrols near the tribe base ----------
function PlayerWarrior({ spawn, color = PLAYER_TRIBE_COLOR }) {

// ---------- An escort warrior: follows the player and fights rival tribe members/raiders ----------
function useEscortAI(group, index, attackArm = null) {
  const legRefs = useRef([]);
  const phase = useRef(Math.random() * 10);
  const attackTimer = useRef(Math.random() * ESCORT_ATTACK_COOLDOWN);
  const swingTimer = useRef(0); // counts down through one melee swing

  useFrame((_, rawDelta) => {
    const delta = Math.min(rawDelta, 0.1);
    if (!group.current) return;
    const pos = group.current.position;
    attackTimer.current -= delta;
    swingTimer.current -= delta;

    const s = useGame.getState();
    const [px, , pz] = playerTransform.position;
    const yaw = playerTransform.yaw;

    // Look for the nearest rival tribe member or raider to fight.
    let target = null;
    let bestDist = ESCORT_AGGRO_RANGE;
    for (const [id, p] of Object.entries(entityRegistry.tribeMembers)) {
      if (!s.tribeMemberState[id]?.alive) continue;
      const d = Math.hypot(p.x - pos.x, p.z - pos.z);
      if (d < bestDist) { bestDist = d; target = { kind: 'tribeMember', id, pos: p }; }
    }
    if (s.raid) {
      for (const r of s.raid.raiders) {
        const p = entityRegistry.raiders[r.id];
        if (!p) continue;
        const d = Math.hypot(p.x - pos.x, p.z - pos.z);
        if (d < bestDist) { bestDist = d; target = { kind: 'raider', id: r.id, pos: p }; }
      }
    }
    if (s.distantRaid) {
      for (const r of s.distantRaid.raiders) {
        const p = entityRegistry.distantRaiders[r.id];
        if (!p) continue;
        const d = Math.hypot(p.x - pos.x, p.z - pos.z);
        if (d < bestDist) { bestDist = d; target = { kind: 'distantRaider', id: r.id, pos: p }; }
      }
    }
    if (s.interTribalRaid) {
      for (const r of s.interTribalRaid.raiders) {
        const p = entityRegistry.interTribalRaiders[r.id];
        if (!p) continue;
        const d = Math.hypot(p.x - pos.x, p.z - pos.z);
        if (d < bestDist) { bestDist = d; target = { kind: 'interTribalRaider', id: r.id, pos: p }; }
      }
    }

    let tx, tz;
    if (target) {
      tx = target.pos.x;
      tz = target.pos.z;
    } else {
      // Hold a formation slot just behind and to the side of the player.
      const side = index % 2 === 0 ? 1 : -1;
      const spread = 0.6 + Math.floor(index / 2) * 0.45;
      const angle = yaw + Math.PI + side * spread;
      tx = px + Math.sin(angle) * ESCORT_FOLLOW_DIST;
      tz = pz + Math.cos(angle) * ESCORT_FOLLOW_DIST;
    }

    const dx = tx - pos.x;
    const dz = tz - pos.z;
    const dist = Math.hypot(dx, dz);

    if (target && dist < ESCORT_ATTACK_RANGE) {
      group.current.rotation.y = Math.atan2(dx, dz);
      if (attackTimer.current <= 0) {
        attackTimer.current = ESCORT_ATTACK_COOLDOWN;
        swingTimer.current = ATTACK_SWING_TIME;
        if (target.kind === 'tribeMember') {
          if (s.mpRole === 'joiner') mpSend({ t: 'tribeDamage', id: target.id, dmg: ESCORT_ATTACK_DAMAGE });
          else s.damageTribeMember(target.id, ESCORT_ATTACK_DAMAGE);
        } else if (target.kind === 'distantRaider') {
          s.damageDistantRaider(target.id, ESCORT_ATTACK_DAMAGE);
        } else if (target.kind === 'interTribalRaider') {
          s.damageInterTribalRaider(target.id, ESCORT_ATTACK_DAMAGE);
        } else {
          s.damageRaider(target.id, ESCORT_ATTACK_DAMAGE);
        }
      }
    } else if (dist > 0.3) {
      const spd = target ? ESCORT_SPEED : ESCORT_SPEED * 0.7;
      pos.x += (dx / dist) * spd * delta;
      pos.z += (dz / dist) * spd * delta;
      group.current.rotation.y = Math.atan2(dx, dz);
      phase.current += delta * spd * 1.5;
      const swing = Math.sin(phase.current) * 0.4;
      for (const leg of legRefs.current) if (leg.ref.current) leg.ref.current.rotation.x = leg.sign * swing;
    } else {
      for (const leg of legRefs.current) if (leg.ref.current) leg.ref.current.rotation.x *= 0.9;
    }

    // Melee swing, after the walk cycle so it overrides the arm's walk pose.
    if (attackArm && attackArm.current && swingTimer.current > 0) {
      attackArm.current.rotation.x = armChopAngle(1 - swingTimer.current / ATTACK_SWING_TIME);
    }

    pos.y = getTerrainHeight(pos.x, pos.z);
  });

  return legRefs;
}
