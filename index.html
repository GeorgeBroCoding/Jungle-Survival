<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jungle King</title>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "three": "https://esm.sh/three@0.160.0",
    "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.16?external=react,react-dom,three",
    "@react-three/drei": "https://esm.sh/@react-three/drei@9.99.0?external=react,react-dom,three,@react-three/fiber",
    "zustand": "https://esm.sh/zustand@4.5.2?external=react",
    "htm": "https://esm.sh/htm@3.1.1",
    "peerjs": "https://esm.sh/peerjs@1.5.4"
  }
}
</script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

html, body, #root {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

canvas {
  display: block;
  outline: none;
  touch-action: none;
}

/* ---------- HUD ---------- */
#hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  color: #fff;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  user-select: none;
}

/* Everything in the top-right lives in this single column, laid out by flexbox
   rather than by absolute coordinates, so items can't land on top of each other. */
.hud-top-right {
  position: absolute;
  top: 16px;
  right: 20px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
  max-width: calc(100vw - 40px);
}

.hud-row {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.meters-counter {
  text-align: right;
  background: rgba(20, 40, 20, 0.65);
  border: 2px solid #c9a227;
  border-radius: 10px;
  padding: 8px 16px;
  font-size: 20px;
  font-weight: bold;
  color: #ffe27a;
}

.meters-counter .label {
  font-size: 11px;
  color: #d8d8b0;
  display: block;
  font-weight: normal;
  letter-spacing: 1px;
}

.meters-counter .coins-line {
  margin-top: 4px;
  font-size: 14px;
  color: #ffd34d;
}

.tribe-panel {
  background: rgba(40, 20, 10, 0.6);
  border: 2px solid #c2453b;
  border-radius: 10px;
  padding: 6px 14px;
  font-size: 14px;
  pointer-events: auto;
  cursor: pointer;
  white-space: nowrap;
}

.stepper {
  display: flex;
  align-items: center;
  gap: 10px;
}

.stepper button {
  width: 32px;
  height: 32px;
  font-size: 18px;
}

.mp-button {
  background: rgba(20, 20, 40, 0.6);
  border: 2px solid #6a8fd8;
  border-radius: 10px;
  padding: 6px 14px;
  font-size: 14px;
  cursor: pointer;
  pointer-events: auto;
  white-space: nowrap;
}

.mp-button.mp-connected {
  border-color: #4a9c4a;
  background: rgba(20, 50, 20, 0.6);
}

/* Banners stack under the minimap rather than floating at top-centre: left-anchored
   means only the right edge can ever reach the top-right column, and max-width
   handles that, so two simultaneous raids can't land on top of each other. */
.raid-banners {
  position: absolute;
  top: 196px;
  left: 20px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
  max-width: min(560px, calc(100vw - 420px));
}

.raid-banner {
  background: rgba(120, 20, 20, 0.85);
  border: 2px solid #ff5a5a;
  border-radius: 10px;
  padding: 8px 20px;
  font-size: 16px;
  font-weight: bold;
  animation: pulseRaid 1s infinite alternate;
}

@keyframes pulseRaid {
  from { box-shadow: 0 0 6px #ff5a5a; }
  to { box-shadow: 0 0 20px #ff5a5a; }
}

.stats-panel {
  position: absolute;
  bottom: 16px;
  left: 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  width: 220px;
}

.stat-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
}

.stat-bar .icon {
  width: 18px;
  text-align: center;
}

.stat-bar .bar-track {
  flex: 1;
  height: 8px;
  background: rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 4px;
  overflow: hidden;
}

.stat-bar .bar-fill {
  height: 100%;
  transition: width 0.3s ease;
}

.bar-fill.health { background: #e0453c; }
.bar-fill.hunger { background: #e0a13c; }
.bar-fill.thirst { background: #3c9be0; }
.bar-fill.energy { background: #e0d23c; }
.bar-fill.warmth { background: #e0703c; }
.bar-fill.sanity { background: #b35ce0; }

.crosshair {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 8px;
  height: 8px;
  margin: -4px;
  border: 2px solid rgba(255,255,255,0.8);
  border-radius: 50%;
}

.interact-prompt {
  position: absolute;
  bottom: 36%;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.6);
  border: 1px solid #ffe27a;
  border-radius: 6px;
  padding: 6px 14px;
  font-size: 14px;
}

/* ---- touch controls ---- */
.touch-controls {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.touch-joystick {
  position: absolute;
  left: 28px;
  bottom: 28px;
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
  border: 2px solid rgba(255,255,255,0.3);
  pointer-events: auto;
  touch-action: none;
}

.touch-joystick-thumb {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 50px;
  height: 50px;
  margin: -25px;
  border-radius: 50%;
  background: rgba(255,255,255,0.35);
  border: 2px solid rgba(255,255,255,0.5);
  pointer-events: none;
}

.touch-actions {
  position: absolute;
  right: 18px;
  bottom: 18px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 10px;
  pointer-events: auto;
}

.touch-row {
  display: flex;
  gap: 10px;
}

.touch-row-main {
  align-items: flex-end;
}

.touch-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.16);
  border: 2px solid rgba(255,255,255,0.35);
  border-radius: 50%;
  color: #fff;
  font-size: 20px;
  user-select: none;
  touch-action: none;
}

.touch-btn-sm {
  width: 46px;
  height: 46px;
  font-size: 18px;
}

.touch-btn-lg {
  width: 64px;
  height: 64px;
  font-size: 24px;
}

.touch-btn-attack {
  background: rgba(224,69,60,0.35);
  border-color: rgba(224,69,60,0.6);
}

.day-clock {
  background: rgba(20, 20, 40, 0.6);
  border: 2px solid #6a8fd8;
  border-radius: 10px;
  padding: 6px 14px;
  font-size: 14px;
  white-space: nowrap;
}

.hotbar {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 6px;
}

.hotbar .slot {
  width: 46px;
  height: 46px;
  border: 2px solid rgba(255,255,255,0.4);
  border-radius: 6px;
  background: rgba(0,0,0,0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  position: relative;
}

.hotbar .slot.active {
  border-color: #ffe27a;
  box-shadow: 0 0 8px #ffe27a;
}

.hotbar .slot .count {
  position: absolute;
  bottom: 2px;
  right: 4px;
  font-size: 10px;
}

.toasts {
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: flex-end;
}

.toast {
  background: rgba(0,0,0,0.7);
  border-left: 3px solid #7fd87f;
  border-radius: 4px;
  padding: 6px 12px;
  font-size: 13px;
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

.notif-btn {
  background: rgba(20,15,8,0.65);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px;
  color: #fdf3da;
  font-size: 14px;
  padding: 6px 12px;
  cursor: pointer;
  pointer-events: auto;
  z-index: 10;
  white-space: nowrap;
}
.notif-panel {
  width: 300px;
  max-height: 400px;
  background: rgba(20,15,8,0.93);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px;
  padding: 10px 12px;
  overflow-y: auto;
  pointer-events: auto;
  z-index: 10;
}
.notif-panel h3 { margin: 0 0 8px; font-size: 13px; color: #f0d060; letter-spacing: 1px; }
.notif-entry {
  padding: 4px 0;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  font-size: 12px;
  color: #d0c8b0;
  display: flex;
  gap: 8px;
  align-items: flex-start;
}
.notif-entry.chat { color: #8abfff; }
.notif-time { color: rgba(255,255,255,0.3); min-width: 32px; font-size: 11px; flex-shrink: 0; }

.chat-log {
  position: absolute;
  left: 20px;
  bottom: 90px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-width: 320px;
}

.chat-msg {
  background: rgba(0,0,0,0.6);
  border-left: 3px solid #6fb8ff;
  border-radius: 4px;
  padding: 4px 10px;
  font-size: 13px;
  animation: fadeIn 0.2s ease;
}

.chat-msg.me {
  border-left-color: #7fd87f;
}

.chat-input-bar {
  position: absolute;
  left: 20px;
  bottom: 50px;
  display: flex;
  gap: 6px;
  pointer-events: auto;
}

.chat-input-bar input {
  width: 260px;
  padding: 8px 10px;
  font-size: 14px;
  border-radius: 6px;
  border: 1px solid #6a5224;
  background: rgba(0,0,0,0.6);
  color: #fdf3da;
}

.chat-input-bar button {
  padding: 8px 14px;
  font-size: 14px;
  border-radius: 6px;
  border: 1px solid #6a5224;
  background: #c9a227;
  color: #1b150f;
  cursor: pointer;
}

/* ---------- Modal panels (clickable, pointer events on) ---------- */
.panel-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: auto;
}

.panel {
  background: linear-gradient(180deg, #2b2118, #1b150f);
  border: 3px solid #c9a227;
  border-radius: 12px;
  padding: 20px 24px;
  color: #fdf3da;
  width: 480px;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
}

.panel h2 {
  margin-bottom: 12px;
  color: #ffe27a;
  border-bottom: 1px solid #6a5224;
  padding-bottom: 8px;
}

.panel .close-hint {
  font-size: 12px;
  color: #b8a98a;
  margin-top: 12px;
  text-align: center;
}

.panel p.desc {
  font-size: 13px;
  color: #d8c8a8;
  margin-bottom: 12px;
  line-height: 1.4;
}

.mp-error {
  color: #ff7a6a !important;
}

.mp-code-input {
  margin-top: 6px;
  width: 90px;
  padding: 6px 8px;
  font-size: 18px;
  letter-spacing: 4px;
  text-transform: uppercase;
  text-align: center;
  border-radius: 6px;
  border: 1px solid #6a5224;
  background: rgba(0,0,0,0.3);
  color: #fdf3da;
}

.mp-code-display {
  font-size: 42px;
  font-weight: bold;
  letter-spacing: 8px;
  text-align: center;
  color: #ffe27a;
  background: rgba(0,0,0,0.3);
  border: 2px solid #c9a227;
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 12px;
}

.inv-section {
  font-size: 12px;
  color: #ffe27a;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin: 12px 0 4px;
  border-bottom: 1px solid #6a5224;
  padding-bottom: 4px;
}

.inv-section:first-of-type {
  margin-top: 0;
}

.shop-item, .craft-item, .inv-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 10px;
  border-radius: 6px;
  margin-bottom: 6px;
  background: rgba(255,255,255,0.04);
}

.shop-item:hover, .craft-item:hover {
  background: rgba(255,255,255,0.1);
}

.shop-item .name, .craft-item .name, .inv-item .name {
  font-weight: bold;
}

.shop-item .desc, .craft-item .desc {
  font-size: 11px;
  color: #b8a98a;
}

.buy-btn, .craft-btn {
  background: #4a7c3f;
  border: 1px solid #7fd87f;
  color: #fff;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  font-weight: bold;
}

.buy-btn:disabled, .craft-btn:disabled {
  background: #555;
  border-color: #888;
  color: #aaa;
  cursor: not-allowed;
}

.price {
  color: #ffe27a;
  font-size: 12px;
}

.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

.tabs button {
  flex: 1;
  background: rgba(255,255,255,0.06);
  border: 1px solid #6a5224;
  color: #fdf3da;
  padding: 6px;
  border-radius: 6px;
  cursor: pointer;
}

.tabs button.active {
  background: #c9a227;
  color: #1b150f;
}

.npc-name {
  color: #7fd8d8;
  font-style: italic;
  margin-bottom: 10px;
}

/* ---------- HUD quick buttons (map / settings) ---------- */
.hud-btn {
  background: rgba(20,15,8,0.65);
  border: 1px solid rgba(255,255,255,0.22);
  border-radius: 8px;
  color: #fdf3da;
  font-family: inherit;
  font-size: 13px;
  padding: 6px 11px;
  cursor: pointer;
  pointer-events: auto;
  white-space: nowrap;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}

.hud-btn:hover {
  background: rgba(60,45,20,0.8);
  border-color: #c9a227;
}

/* ---------- Circular minimap (top-left) ---------- */
.minimap {
  position: absolute;
  top: 16px;
  left: 20px;
  width: 168px;
  height: 168px;
  border-radius: 50%;
  border: 3px solid #c9a227;
  background: #0d1a0d;
  overflow: hidden;
  pointer-events: auto;
  cursor: pointer;
  box-shadow: 0 4px 18px rgba(0,0,0,0.55);
}

.minimap canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.minimap .mm-tick {
  position: absolute;
  top: 1px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  font-weight: bold;
  color: #ffe27a;
  text-shadow: 0 1px 3px #000;
  pointer-events: none;
}

.minimap .mm-coords {
  position: absolute;
  bottom: 3px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  color: #ffe27a;
  background: rgba(0,0,0,0.5);
  padding: 0 5px;
  border-radius: 3px;
  pointer-events: none;
}

.minimap:hover {
  border-color: #ffe27a;
}

/* ---------- Death screen ---------- */
/* The 1.1s delay lets the collapse animation play before the UI covers the view.
   `both` holds the opening keyframe, so it stays invisible until the delay is up. */
.death-screen {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at center, rgba(90,8,8,0.55), rgba(0,0,0,0.9));
  pointer-events: auto;
  z-index: 50;
  animation: deathFade 0.9s ease 1.1s both;
}

@keyframes deathFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

.death-inner {
  text-align: center;
  padding: 0 24px;
  max-width: 420px;
}

.death-screen h1 {
  font-size: 68px;
  line-height: 1;
  font-weight: bold;
  letter-spacing: 2px;
  color: #ff4036;
  text-shadow: 0 0 24px rgba(255,40,30,0.55), 0 4px 10px rgba(0,0,0,0.9);
  margin-bottom: 14px;
  animation: deathTitle 1.1s ease 1.1s both;
}

@keyframes deathTitle {
  from { transform: scale(1.35); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.death-cause {
  font-size: 17px;
  color: #e8cfc0;
  margin-bottom: 20px;
}

.death-tally {
  display: flex;
  justify-content: center;
  gap: 22px;
  margin-bottom: 24px;
  font-size: 13px;
  color: #b8a98a;
}

.death-tally strong {
  display: block;
  font-size: 19px;
  color: #ffe27a;
}

.death-btn {
  background: #4a7c3f;
  border: 2px solid #7fd87f;
  color: #fff;
  font-family: inherit;
  font-size: 19px;
  font-weight: bold;
  padding: 12px 42px;
  border-radius: 10px;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
}

.death-btn:hover {
  background: #5a9a4b;
  border-color: #a8f0a8;
}

.death-hint {
  margin-top: 16px;
  font-size: 12px;
  color: #9a8e75;
  line-height: 1.5;
}

/* ---------- World map ---------- */
.panel.panel-wide {
  width: min(640px, 94vw);
}

.map-wrap {
  position: relative;
  line-height: 0;
}

/* Scaled by width only, so the canvas stays exactly square (1:1 intrinsic size)
   and MapPanel can map client coords straight onto canvas pixels. */
.map-canvas {
  display: block;
  width: 100%;
  height: auto;
  border: 2px solid #6a5224;
  border-radius: 8px;
  background: #0d1a0d;
  cursor: grab;
  touch-action: none;
}

.map-canvas.dragging {
  cursor: grabbing;
}

.map-compass {
  position: absolute;
  top: 8px;
  right: 10px;
  font-size: 11px;
  letter-spacing: 1px;
  color: #ffe27a;
  background: rgba(0,0,0,0.45);
  padding: 2px 7px;
  border-radius: 4px;
  line-height: 1.4;
}

.map-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin: 10px 0 2px;
  font-size: 12px;
  color: #d8c8a8;
}

.map-toolbar .spacer {
  margin-left: auto;
}

.map-toolbar label {
  display: flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
}

.map-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 5px 14px;
  margin-top: 8px;
  font-size: 11px;
  color: #cdbfa0;
}

.map-legend span {
  display: flex;
  align-items: center;
  gap: 5px;
}

.map-legend i {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
  border: 1px solid rgba(0,0,0,0.5);
}

/* ---------- Settings / control rebinding ---------- */
.set-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 10px;
  border-radius: 6px;
  margin-bottom: 4px;
  background: rgba(255,255,255,0.04);
}

.set-row:hover {
  background: rgba(255,255,255,0.08);
}

.set-row .set-label {
  flex: 1;
  font-size: 13px;
}

.key-btn {
  min-width: 90px;
  background: rgba(0,0,0,0.35);
  border: 1px solid #6a5224;
  color: #ffe27a;
  font-family: inherit;
  font-size: 12px;
  font-weight: bold;
  padding: 5px 10px;
  border-radius: 6px;
  cursor: pointer;
}

.key-btn:hover {
  border-color: #c9a227;
  background: rgba(201,162,39,0.18);
}

.key-btn.listening {
  background: #c9a227;
  border-color: #ffe27a;
  color: #1b150f;
  animation: keyPulse 1s ease-in-out infinite;
}

.key-btn.fixed {
  cursor: default;
  color: #b8a98a;
  border-style: dashed;
}

.key-btn.fixed:hover {
  border-color: #6a5224;
  background: rgba(0,0,0,0.35);
}

@keyframes keyPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}

/* A light cinematic grade over the 3D view: a vignette to pull the eye to the
   centre and a faint warm lift in the corners. Purely visual, never interactive,
   and it sits under the HUD so nothing becomes hard to read. */
.perf-stats {
  position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 10px; padding: 4px 10px;
  background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 226, 122, 0.25);
  border-radius: 6px; font: 600 12px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
  color: #ffe27a; letter-spacing: 0.3px; pointer-events: none; z-index: 3;
}
.gfx-presets {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.set-value {
  color: #ffe27a;
  text-align: right;
  font-size: 13px;
  max-width: 48%;
}
.set-hint {
  font-size: 11px;
  color: #b8a98a;
  margin: 2px 0 10px;
  line-height: 1.5;
}

.set-slider {
  display: flex;
  align-items: center;
  gap: 10px;
}

.set-slider input[type=range] {
  width: 170px;
}

.start-screen {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, #1e3a1e, #08130a);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #fff;
  text-align: center;
  z-index: 1000;
}

.start-screen h1 {
  font-size: 56px;
  color: #ffe27a;
  text-shadow: 0 4px 12px rgba(0,0,0,0.7);
  letter-spacing: 4px;
}

.start-screen p {
  margin-top: 8px;
  color: #cfead0;
  max-width: 600px;
}

.start-screen button {
  margin-top: 28px;
  font-size: 20px;
  padding: 14px 36px;
  background: #4a7c3f;
  border: 2px solid #7fd87f;
  color: #fff;
  border-radius: 10px;
  cursor: pointer;
}

.start-screen .controls-list {
  margin-top: 20px;
  font-size: 12px;
  color: #a9c9ab;
  max-width: 640px;
  line-height: 1.6;
}
</style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
