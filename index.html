<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jungle King</title>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "three": "https://esm.sh/three@0.160.0",
    "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.16?external=react,react-dom,three",
    "@react-three/drei": "https://esm.sh/@react-three/drei@9.99.0?external=react,react-dom,three,@react-three/fiber",
    "zustand": "https://esm.sh/zustand@4.5.2?external=react",
    "htm": "https://esm.sh/htm@3.1.1",
    "peerjs": "https://esm.sh/peerjs@1.5.4"
  }
}
</script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

html, body, #root {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

canvas {
  display: block;
  outline: none;
  touch-action: none;
}

/* ---------- HUD ---------- */
#hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  color: #fff;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  user-select: none;
}

/* Everything in the top-right lives in this single column, laid out by flexbox
   rather than by absolute coordinates, so items can't land on top of each other. */
.hud-top-right {
  position: absolute;
  top: 16px;
  right: 20px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
  max-width: calc(100vw - 40px);
}

.hud-row {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.meters-counter {
  text-align: right;
  background: rgba(20, 40, 20, 0.65);
  border: 2px solid #c9a227;
  border-radius: 10px;
  padding: 8px 16px;
  font-size: 20px;
  font-weight: bold;
  color: #ffe27a;
}

.meters-counter .label {
  font-size: 11px;
  color: #d8d8b0;
  display: block;
  font-weight: normal;
  letter-spacing: 1px;
}

.meters-counter .coins-line {
  margin-top: 4px;
  font-size: 14px;
  color: #ffd34d;
}

.tribe-panel {
  background: rgba(40, 20, 10, 0.6);
  border: 2px solid #c2453b;
  border-radius: 10px;
  padding: 6px 14px;
  font-size: 14px;
  pointer-events: auto;
  cursor: pointer;
  white-space: nowrap;
}

.stepper {
  display: flex;
  align-items: center;
  gap: 10px;
}

.stepper button {
  width: 32px;
  height: 32px;
  font-size: 18px;
}

.mp-button {
  background: rgba(20, 20, 40, 0.6);
  border: 2px solid #6a8fd8;
  border-radius: 10px;
  padding: 6px 14px;
  font-size: 14px;
  cursor: pointer;
  pointer-events: auto;
  white-space: nowrap;
}

.mp-button.mp-connected {
  border-color: #4a9c4a;
  background: rgba(20, 50, 20, 0.6);
}

/* Banners stack under the minimap rather than floating at top-centre: left-anchored
   means only the right edge can ever reach the top-right column, and max-width
   handles that, so two simultaneous raids can't land on top of each other. */
.raid-banners {
  position: absolute;
  top: 196px;
  left: 20px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
  max-width: min(560px, calc(100vw - 420px));
}

.raid-banner {
  background: rgba(120, 20, 20, 0.85);
  border: 2px solid #ff5a5a;
  border-radius: 10px;
  padding: 8px 20px;
  font-size: 16px;
  font-weight: bold;
  animation: pulseRaid 1s infinite alternate;
}

@keyframes pulseRaid {
  from { box-shadow: 0 0 6px #ff5a5a; }
  to { box-shadow: 0 0 20px #ff5a5a; }
}

.stats-panel {
  position: absolute;
  bottom: 16px;
  left: 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  width: 220px;
}

.stat-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
}

.stat-bar .icon {
  width: 18px;
  text-align: center;
}

.stat-bar .bar-track {
  flex: 1;
  height: 8px;
  background: rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 4px;
  overflow: hidden;
}

.stat-bar .bar-fill {
  height: 100%;
  transition: width 0.3s ease;
}

.bar-fill.health { background: #e0453c; }
.bar-fill.hunger { background: #e0a13c; }
.bar-fill.thirst { background: #3c9be0; }
.bar-fill.energy { background: #e0d23c; }
.bar-fill.warmth { background: #e0703c; }
.bar-fill.sanity { background: #b35ce0; }

.crosshair {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 8px;
  height: 8px;
  margin: -4px;
  border: 2px solid rgba(255,255,255,0.8);
  border-radius: 50%;
}

.interact-prompt {
  position: absolute;
  bottom: 36%;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.6);
  border: 1px solid #ffe27a;
  border-radius: 6px;
  padding: 6px 14px;
  font-size: 14px;
}

/* ---- touch controls ---- */
.touch-controls {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.touch-joystick {
  position: absolute;
  left: 28px;
  bottom: 28px;
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
  border: 2px solid rgba(255,255,255,0.3);
  pointer-events: auto;
  touch-action: none;
}

.touch-joystick-thumb {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 50px;
  height: 50px;
  margin: -25px;
  border-radius: 50%;
  background: rgba(255,255,255,0.35);
  border: 2px solid rgba(255,255,255,0.5);
  pointer-events: none;
}

.touch-actions {
  position: absolute;
  right: 18px;
  bottom: 18px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 10px;
  pointer-events: auto;
}

.touch-row {
  display: flex;
  gap: 10px;
}

.touch-row-main {
  align-items: flex-end;
}

.touch-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.16);
  border: 2px solid rgba(255,255,255,0.35);
  border-radius: 50%;
  color: #fff;
  font-size: 20px;
  user-select: none;
  touch-action: none;
}

.touch-btn-sm {
  width: 46px;
  height: 46px;
  font-size: 18px;
}

.touch-btn-lg {
  width: 64px;
  height: 64px;
  font-size: 24px;
}

.touch-btn-attack {
  background: rgba(224,69,60,0.35);
  border-color: rgba(224,69,60,0.6);
}

.day-clock {
  background: rgba(20, 20, 40, 0.6);
  border: 2px solid #6a8fd8;
  border-radius: 10px;
  padding: 6px 14px;
  font-size: 14px;
  white-space: nowrap;
}

.hotbar {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 6px;
}

.hotbar .slot {
  width: 46px;
  height: 46px;
  border: 2px solid rgba(255,255,255,0.4);
  border-radius: 6px;
  background: rgba(0,0,0,0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  position: relative;
}

.hotbar .slot.active {
  border-color: #ffe27a;
  box-shadow: 0 0 8px #ffe27a;
}

.hotbar .slot .count {
  position: absolute;
  bottom: 2px;
  right: 4px;
  font-size: 10px;
}

.toasts {
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: flex-end;
}

.toast {
  background: rgba(0,0,0,0.7);
  border-left: 3px solid #7fd87f;
  border-radius: 4px;
  padding: 6px 12px;
  font-size: 13px;
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

.notif-btn {
  background: rgba(20,15,8,0.65);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px;
  color: #fdf3da;
  font-size: 14px;
  padding: 6px 12px;
  cursor: pointer;
  pointer-events: auto;
  z-index: 10;
  white-space: nowrap;
}
.notif-panel {
  width: 300px;
  max-height: 400px;
  background: rgba(20,15,8,0.93);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px;
  padding: 10px 12px;
  overflow-y: auto;
  pointer-events: auto;
  z-index: 10;
}
.notif-panel h3 { margin: 0 0 8px; font-size: 13px; color: #f0d060; letter-spacing: 1px; }
.notif-entry {
  padding: 4px 0;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  font-size: 12px;
  color: #d0c8b0;
  display: flex;
  gap: 8px;
  align-items: flex-start;
}
.notif-entry.chat { color: #8abfff; }
.notif-time { color: rgba(255,255,255,0.3); min-width: 32px; font-size: 11px; flex-shrink: 0; }

.chat-log {
  position: absolute;
  left: 20px;
  bottom: 90px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-width: 320px;
}

.chat-msg {
  background: rgba(0,0,0,0.6);
  border-left: 3px solid #6fb8ff;
  border-radius: 4px;
  padding: 4px 10px;
  font-size: 13px;
  animation: fadeIn 0.2s ease;
}

.chat-msg.me {
  border-left-color: #7fd87f;
}

.chat-input-bar {
  position: absolute;
  left: 20px;
  bottom: 50px;
  display: flex;
  gap: 6px;
  pointer-events: auto;
}

.chat-input-bar input {
  width: 260px;
  padding: 8px 10px;
  font-size: 14px;
  border-radius: 6px;
  border: 1px solid #6a5224;
  background: rgba(0,0,0,0.6);
  color: #fdf3da;
}

.chat-input-bar button {
  padding: 8px 14px;
  font-size: 14px;
  border-radius: 6px;
  border: 1px solid #6a5224;
  background: #c9a227;
  color: #1b150f;
  cursor: pointer;
}

/* ---------- Modal panels (clickable, pointer events on) ---------- */
.panel-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: auto;
}

.panel {
  background: linear-gradient(180deg, #2b2118, #1b150f);
  border: 3px solid #c9a227;
  border-radius: 12px;
  padding: 20px 24px;
  color: #fdf3da;
  width: 480px;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
}

.panel h2 {
  margin-bottom: 12px;
  color: #ffe27a;
  border-bottom: 1px solid #6a5224;
  padding-bottom: 8px;
}

.panel .close-hint {
  font-size: 12px;
  color: #b8a98a;
  margin-top: 12px;
  text-align: center;
}

.panel p.desc {
  font-size: 13px;
  color: #d8c8a8;
  margin-bottom: 12px;
  line-height: 1.4;
}

.mp-error {
  color: #ff7a6a !important;
}

.mp-code-input {
  margin-top: 6px;
  width: 90px;
  padding: 6px 8px;
  font-size: 18px;
  letter-spacing: 4px;
  text-transform: uppercase;
  text-align: center;
  border-radius: 6px;
  border: 1px solid #6a5224;
  background: rgba(0,0,0,0.3);
  color: #fdf3da;
}

.mp-code-display {
  font-size: 42px;
  font-weight: bold;
  letter-spacing: 8px;
  text-align: center;
  color: #ffe27a;
  background: rgba(0,0,0,0.3);
  border: 2px solid #c9a227;
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 12px;
}

.inv-section {
  font-size: 12px;
  color: #ffe27a;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin: 12px 0 4px;
  border-bottom: 1px solid #6a5224;
  padding-bottom: 4px;
}

.inv-section:first-of-type {
  margin-top: 0;
}

.shop-item, .craft-item, .inv-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 10px;
  border-radius: 6px;
  margin-bottom: 6px;
  background: rgba(255,255,255,0.04);
}

.shop-item:hover, .craft-item:hover {
  background: rgba(255,255,255,0.1);
}

.shop-item .name, .craft-item .name, .inv-item .name {
  font-weight: bold;
}

.shop-item .desc, .craft-item .desc {
  font-size: 11px;
  color: #b8a98a;
}

.buy-btn, .craft-btn {
  background: #4a7c3f;
  border: 1px solid #7fd87f;
  color: #fff;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  font-weight: bold;
}

.buy-btn:disabled, .craft-btn:disabled {
  background: #555;
  border-color: #888;
  color: #aaa;
  cursor: not-allowed;
}

.price {
  color: #ffe27a;
  font-size: 12px;
}

.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

.tabs button {
  flex: 1;
  background: rgba(255,255,255,0.06);
  border: 1px solid #6a5224;
  color: #fdf3da;
  padding: 6px;
  border-radius: 6px;
  cursor: pointer;
}

.tabs button.active {
  background: #c9a227;
  color: #1b150f;
}

.npc-name {
  color: #7fd8d8;
  font-style: italic;
  margin-bottom: 10px;
}

/* ---------- HUD quick buttons (map / settings) ---------- */
.hud-btn {
  background: rgba(20,15,8,0.65);
  border: 1px solid rgba(255,255,255,0.22);
  border-radius: 8px;
  color: #fdf3da;
  font-family: inherit;
  font-size: 13px;
  padding: 6px 11px;
  cursor: pointer;
  pointer-events: auto;
  white-space: nowrap;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}

.hud-btn:hover {
  background: rgba(60,45,20,0.8);
  border-color: #c9a227;
}

/* ---------- Circular minimap (top-left) ---------- */
.minimap {
  position: absolute;
  top: 16px;
  left: 20px;
  width: 168px;
  height: 168px;
  border-radius: 50%;
  border: 3px solid #c9a227;
  background: #0d1a0d;
  overflow: hidden;
  pointer-events: auto;
  cursor: pointer;
  box-shadow: 0 4px 18px rgba(0,0,0,0.55);
}

.minimap canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.minimap .mm-tick {
  position: absolute;
  top: 1px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  font-weight: bold;
  color: #ffe27a;
  text-shadow: 0 1px 3px #000;
  pointer-events: none;
}

.minimap .mm-coords {
  position: absolute;
  bottom: 3px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  color: #ffe27a;
  background: rgba(0,0,0,0.5);
  padding: 0 5px;
  border-radius: 3px;
  pointer-events: none;
}

.minimap:hover {
  border-color: #ffe27a;
}

/* ---------- Death screen ---------- */
/* The 1.1s delay lets the collapse animation play before the UI covers the view.
   `both` holds the opening keyframe, so it stays invisible until the delay is up. */
.death-screen {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at center, rgba(90,8,8,0.55), rgba(0,0,0,0.9));
  pointer-events: auto;
  z-index: 50;
  animation: deathFade 0.9s ease 1.1s both;
}

@keyframes deathFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

.death-inner {
  text-align: center;
  padding: 0 24px;
  max-width: 420px;
}

.death-screen h1 {
  font-size: 68px;
  line-height: 1;
  font-weight: bold;
  letter-spacing: 2px;
  color: #ff4036;
  text-shadow: 0 0 24px rgba(255,40,30,0.55), 0 4px 10px rgba(0,0,0,0.9);
  margin-bottom: 14px;
  animation: deathTitle 1.1s ease 1.1s both;
}

@keyframes deathTitle {
  from { transform: scale(1.35); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.death-cause {
  font-size: 17px;
  color: #e8cfc0;
  margin-bottom: 20px;
}

.death-tally {
  display: flex;
  justify-content: center;
  gap: 22px;
  margin-bottom: 24px;
  font-size: 13px;
  color: #b8a98a;
}

.death-tally strong {
  display: block;
  font-size: 19px;
  color: #ffe27a;
}

.death-btn {
  background: #4a7c3f;
  border: 2px solid #7fd87f;
  color: #fff;
  font-family: inherit;
  font-size: 19px;
  font-weight: bold;
  padding: 12px 42px;
  border-radius: 10px;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
}

.death-btn:hover {
  background: #5a9a4b;
  border-color: #a8f0a8;
}

.death-hint {
  margin-top: 16px;
  font-size: 12px;
  color: #9a8e75;
  line-height: 1.5;
}

/* ---------- World map ---------- */
.panel.panel-wide {
  width: min(640px, 94vw);
}

.map-wrap {
  position: relative;
  line-height: 0;
}

/* Scaled by width only, so the canvas stays exactly square (1:1 intrinsic size)
   and MapPanel can map client coords straight onto canvas pixels. */
.map-canvas {
  display: block;
  width: 100%;
  height: auto;
  border: 2px solid #6a5224;
  border-radius: 8px;
  background: #0d1a0d;
  cursor: grab;
  touch-action: none;
}

.map-canvas.dragging {
  cursor: grabbing;
}

.map-compass {
  position: absolute;
  top: 8px;
  right: 10px;
  font-size: 11px;
  letter-spacing: 1px;
  color: #ffe27a;
  background: rgba(0,0,0,0.45);
  padding: 2px 7px;
  border-radius: 4px;
  line-height: 1.4;
}

.map-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin: 10px 0 2px;
  font-size: 12px;
  color: #d8c8a8;
}

.map-toolbar .spacer {
  margin-left: auto;
}

.map-toolbar label {
  display: flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
}

.map-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 5px 14px;
  margin-top: 8px;
  font-size: 11px;
  color: #cdbfa0;
}

.map-legend span {
  display: flex;
  align-items: center;
  gap: 5px;
}

.map-legend i {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
  border: 1px solid rgba(0,0,0,0.5);
}

/* ---------- Settings / control rebinding ---------- */
.set-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 10px;
  border-radius: 6px;
  margin-bottom: 4px;
  background: rgba(255,255,255,0.04);
}

.set-row:hover {
  background: rgba(255,255,255,0.08);
}

.set-row .set-label {
  flex: 1;
  font-size: 13px;
}

.key-btn {
  min-width: 90px;
  background: rgba(0,0,0,0.35);
  border: 1px solid #6a5224;
  color: #ffe27a;
  font-family: inherit;
  font-size: 12px;
  font-weight: bold;
  padding: 5px 10px;
  border-radius: 6px;
  cursor: pointer;
}

.key-btn:hover {
  border-color: #c9a227;
  background: rgba(201,162,39,0.18);
}

.key-btn.listening {
  background: #c9a227;
  border-color: #ffe27a;
  color: #1b150f;
  animation: keyPulse 1s ease-in-out infinite;
}

.key-btn.fixed {
  cursor: default;
  color: #b8a98a;
  border-style: dashed;
}

.key-btn.fixed:hover {
  border-color: #6a5224;
  background: rgba(0,0,0,0.35);
}

@keyframes keyPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}

/* A light cinematic grade over the 3D view: a vignette to pull the eye to the
   centre and a faint warm lift in the corners. Purely visual, never interactive,
   and it sits under the HUD so nothing becomes hard to read. */
.grade-overlay {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  background:

// ============================================================
// keyboard.js - global keyboard state
// ============================================================
const keys = {};
const pressHandlers = new Set();
// When the settings panel is waiting for a rebind, it parks a grabber here.
let keyCapture = null;

function isTypingInField() {
  const el = document.activeElement;
  return !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA');
}

window.addEventListener('keydown', (e) => {

  // doesn't also pop the build menu on the way through.
  if (keyCapture) {
    e.preventDefault();
    const grab = keyCapture;
    keyCapture = null;
    grab(e.code);
    return;

function simulateKeyPress(code) {

// Returns a cancel function.

// fire once per press and are routed through actionForCode().
const KEYBIND_ACTIONS = [
  { id: 'moveForward', group: 'Movement',  label: 'Move forward',        def: 'KeyW',        held: true },
  { id: 'moveBack',    group: 'Movement',  label: 'Move backward',       def: 'KeyS',        held: true },
  { id: 'moveLeft',    group: 'Movement',  label: 'Strafe left',         def: 'KeyA',        held: true },
  { id: 'moveRight',   group: 'Movement',  label: 'Strafe right',        def: 'KeyD',        held: true },
  { id: 'jump',        group: 'Movement',  label: 'Jump',                def: 'Space',       held: true },
  { id: 'sprint',      group: 'Movement',  label: 'Sprint',              def: 'ShiftLeft',   held: true },

// Esc is the universal close/cancel key, so it can never be bound to an action.
const RESERVED_CODES = new Set(['Escape']);

// The map is a heads-up panel, not a modal: you keep walking while it's open so the
// marker tracks you live. Every other panel freezes movement as before.
function panelBlocksMovement(panel) {

}

const DEFAULT_KEYBINDS = Object.fromEntries(KEYBIND_ACTIONS.map((a) => [a.id, a.def]));
const KEYBINDS_STORAGE_KEY = 'jungleking.keybinds.v1';

// Plain-object mirrors of the store's bindings. The player's frame loop reads
// these directly so polling movement keys never costs a store lookup.
let activeBinds = { ...DEFAULT_KEYBINDS };
let codeToAction = {};
function setActiveBinds(binds) {
  activeBinds = binds;
  codeToAction = {};
  for (const id in binds) codeToAction[binds[id]] = id;
}

function loadKeybinds() {
  const binds = { ...DEFAULT_KEYBINDS };
  try {
    const saved = JSON.parse(localStorage.getItem(KEYBINDS_STORAGE_KEY) || 'null');
    // Only trust ids we still ship, so an old save can't resurrect a dead action.
    if (saved) {
      for (const id in binds) {
        if (typeof saved[id] === 'string' && saved[id] && !RESERVED_CODES.has(saved[id])) binds[id] = saved[id];

}

function saveKeybinds(binds) {
  try { localStorage.setItem(KEYBINDS_STORAGE_KEY, JSON.stringify(binds)); } catch (e) {}
}

setActiveBinds(loadKeybinds());

function bind(actionId) { return activeBinds[actionId]; }

// Which action a pressed key triggers. Numpad digits fall through to the
// matching number-row digit, so Numpad 0 still pokes while poke sits on 0.
function actionForCode(code) {
  if (codeToAction[code]) return codeToAction[code];

function simulateAction(actionId) {
  const code = activeBinds[actionId];
  if (code) simulateKeyPress(code);
}

const KEY_LABEL_OVERRIDES = {

  ShiftLeft: 'L Shift', ShiftRight: 'R Shift', ControlLeft: 'L Ctrl', ControlRight: 'R Ctrl',
  AltLeft: 'L Alt', AltRight: 'R Alt', MetaLeft: 'Cmd', MetaRight: 'Cmd', CapsLock: 'Caps',
  ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓',
  Minus: '-', Equal: '=', BracketLeft: '[', BracketRight: ']', Backslash: '\\',
  Semicolon: ';', Quote: "'", Comma: ',', Period: '.', Slash: '/', Backquote: '`',

// Mouse look tuning, also set from the settings panel. Kept as a plain object so
// the pointer-move handler reads the live value instead of a stale closure.
const INPUT_SETTINGS_KEY = 'jungleking.input.v1';
const inputSettings = { lookSens: 1, invertY: false };

  const saved = JSON.parse(localStorage.getItem(INPUT_SETTINGS_KEY) || 'null');
  if (saved) {
    if (typeof saved.lookSens === 'number' && isFinite(saved.lookSens)) {
      inputSettings.lookSens = Math.max(0.3, Math.min(3, saved.lookSens));

    if (typeof saved.invertY === 'boolean') inputSettings.invertY = saved.invertY;

function saveInputSettings() {
  try { localStorage.setItem(INPUT_SETTINGS_KEY, JSON.stringify(inputSettings)); } catch (e) {}
}

// ============================================================
// graphics.js - quality presets
//
// The realistic pass (instanced grass, layered terrain detail, big shadow
// maps, a live sky environment map) is not free. These presets scale the
// expensive parts so the same build runs on a laptop and on a desktop GPU.
// Everything here is applied live - no reload, and the player never moves.
// ============================================================
const GRAPHICS_KEY = 'jungleking.graphics.v1';
const GRAPHICS_PRESETS = {
  low: {
    label: 'Low', grassRadius: 0, grassPerCell: 0, foliage: 150,
    shadowMap: 1024, shadowExtent: 48, envSeconds: 0, dpr: 1.0,
    vines: false, treeDetail: 0, waterSegments: 24,
    fireLights: 1, fireShadows: false, contactShadows: false, eyeAdapt: false,
  },
  medium: {
    label: 'Medium', grassRadius: 20, grassPerCell: 5, foliage: 220,
    shadowMap: 2048, shadowExtent: 40, envSeconds: 4, dpr: 1.35,
    vines: false, treeDetail: 1, waterSegments: 48,
    fireLights: 2, fireShadows: false, contactShadows: true, eyeAdapt: true,
  },
  high: {
    label: 'High', grassRadius: 30, grassPerCell: 8, foliage: 300,
    shadowMap: 2048, shadowExtent: 34, envSeconds: 2, dpr: 1.6,
    vines: true, treeDetail: 2, waterSegments: 72,
    fireLights: 2, fireShadows: true, contactShadows: true, eyeAdapt: true,
  },
  ultra: {
    label: 'Ultra', grassRadius: 42, grassPerCell: 12, foliage: 380,
    shadowMap: 4096, shadowExtent: 30, envSeconds: 1.2, dpr: 2.0,
    vines: true, treeDetail: 2, waterSegments: 96,
    fireLights: 3, fireShadows: true, contactShadows: true, eyeAdapt: true,
  },
};

// The shadow box is pushed this far forward along the view direction (as a
// fraction of its half-size) instead of being centred on the player. You can
// only see shadows in front of you, so spending the map on what is behind you
// is waste: the shift buys ~1.4x the forward reach from a box ~30% smaller,
// which is where the extra sharpness comes from.
const SHADOW_FORWARD_BIAS = 0.4;

// ---------- Canopy cover field ----------
// A coarse 2.5m grid of "how much leaf is overhead", splatted once when the
// foliage is placed. The eye-adaptation code needs to know when you have
// walked under a tree, and asking the GPU is not an option - this answers it
// in a bilinear lookup. Also quality-dependent on purpose: fewer trees really
// does mean a brighter jungle.
const CANOPY_HALF = 250;
const CANOPY_CELLS = 200;
const CANOPY_CELL = (CANOPY_HALF * 2) / CANOPY_CELLS;
const canopyField = { grid: new Float32Array(CANOPY_CELLS * CANOPY_CELLS), ready: false };

function canopyReset() {
  canopyField.grid.fill(0);
  canopyField.ready = false;
}
function canopySplat(x, z, radius, weight) {
  const g = canopyField.grid;
  const fx = (x + CANOPY_HALF) / CANOPY_CELL;
  const fz = (z + CANOPY_HALF) / CANOPY_CELL;
  const rad = Math.max(0.5, radius / CANOPY_CELL);
  const i0 = Math.max(0, Math.floor(fx - rad)), i1 = Math.min(CANOPY_CELLS - 1, Math.ceil(fx + rad));
  const j0 = Math.max(0, Math.floor(fz - rad)), j1 = Math.min(CANOPY_CELLS - 1, Math.ceil(fz + rad));
  for (let j = j0; j <= j1; j++) {
    for (let i = i0; i <= i1; i++) {
      const dx = (i + 0.5 - fx) / rad, dz = (j + 0.5 - fz) / rad;
      const d2 = dx * dx + dz * dz;
      if (d2 >= 1) continue;
      g[j * CANOPY_CELLS + i] += weight * (1 - d2);
    }
  }
}
function canopyAt(ix, iz) {
  if (ix < 0 || iz < 0 || ix >= CANOPY_CELLS || iz >= CANOPY_CELLS) return 0;
  return canopyField.grid[iz * CANOPY_CELLS + ix];
}
function canopyCoverAt(x, z) {
  if (!canopyField.ready) return 0;
  const fx = (x + CANOPY_HALF) / CANOPY_CELL - 0.5;
  const fz = (z + CANOPY_HALF) / CANOPY_CELL - 0.5;
  const i = Math.floor(fx), j = Math.floor(fz);
  const tx = fx - i, tz = fz - j;
  const v = canopyAt(i, j) * (1 - tx) * (1 - tz)
    + canopyAt(i + 1, j) * tx * (1 - tz)
    + canopyAt(i, j + 1) * (1 - tx) * tz
    + canopyAt(i + 1, j + 1) * tx * tz;
  return v < 0 ? 0 : v > 1 ? 1 : v;

// ---------- Fire light pool ----------
// Every campfire draws its own flame, but point lights are not free and the
// light count has to stay constant or three.js recompiles every material the
// moment a camp comes into range. So the fires register their positions here
// and DayNightSystem hands the nearest few a light out of a fixed pool.
const fireRegistry = {}; // { [id]: [x, y, z] }
const GRAPHICS_ORDER = ['low', 'medium', 'high', 'ultra'];

// on. Monitors and eyes differ more than any amount of tuning can allow for,
// so this is the one knob that is a slider rather than a preset.
const graphicsSettings = { quality: 'high', brightness: 1.0, showStats: false };
try {
  const saved = JSON.parse(localStorage.getItem(GRAPHICS_KEY) || 'null');
  if (saved && GRAPHICS_PRESETS[saved.quality]) graphicsSettings.quality = saved.quality;
  if (saved && typeof saved.brightness === 'number' && isFinite(saved.brightness)) {
    graphicsSettings.brightness = Math.max(0.6, Math.min(1.8, saved.brightness));
  }
  if (saved && typeof saved.showStats === 'boolean') graphicsSettings.showStats = saved.showStats;
} catch (e) {}

// is to measure it and put the number on screen.
const perfStats = { fps: 0, ms: 0, draws: 0, tris: 0 };

  try { localStorage.setItem(GRAPHICS_KEY, JSON.stringify(graphicsSettings)); } catch (e) {}
}

function gfx() { return GRAPHICS_PRESETS[graphicsSettings.quality] || GRAPHICS_PRESETS.high; }

// ============================================================
// touch.js - on-screen controls for tablets/phones (no keyboard/mouse)
// ============================================================
const isTouchDevice = (typeof window !== 'undefined')
  && (('ontouchstart' in window) || navigator.maxTouchPoints > 0);

// Written by the virtual joystick / look-drag, consumed each frame by Player.
const touchInput = {
  moveX: 0, moveZ: 0, // virtual joystick vector, same sign convention as WASD
  lookDX: 0, lookDY: 0, // accumulated look-drag delta (pixels) since last frame
  attack: () => {}, // wired up by Player to throw/swing the equipped weapon
};

// ============================================================
// multiplayer.js - optional 2-player peer-to-peer link via PeerJS
// (uses PeerJS's free public broker only to help the two devices find
// each other; gameplay data flows directly between the two browsers)
// ============================================================
const MP_CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no 0/O/1/I
function randomMpCode() {
  let code = '';
  for (let i = 0; i < 4; i++) code += MP_CODE_CHARS[Math.floor(Math.random() * MP_CODE_CHARS.length)];
  return code;
}

// Live connection objects (not React state - these are imperative singletons).
const mpState = { peer: null, conn: null };

// Latest known state of the other player, read every frame by RemotePlayer.
// position/yaw are interpolation targets; lerped toward in useFrame.
const remotePlayer = {
  active: false,
  position: [0, 1, 8],
  yaw: 0,
  moving: false,
  sprinting: false,
  crouching: false,
  equippedWeaponId: null,
  attackSeq: 0,
};

// ---- shared rival-tribe-camp state (host is authoritative) ----
// Host: populated each frame by TribeMember's wander AI, broadcast periodically.
const tribeMemberSyncData = {}; // { [memberId]: { position: [x,y,z], yaw } }
// Joiner: latest positions received from the host, lerped toward each frame.
const remoteTribeMembers = {}; // { [memberId]: { position: [x,y,z], yaw } }

function mpSetupConnection(conn) {
  mpState.conn = conn;
  conn.on('open', () => {
    useGame.getState().setMpStatus('connected');
    remotePlayer.active = true;
  });
  conn.on('data', (msg) => {
    if (!msg || typeof msg !== 'object') return;
    if (msg.t === 'state') {
      remotePlayer.position = msg.position;
      remotePlayer.yaw = msg.yaw;
      remotePlayer.moving = msg.moving;
      remotePlayer.sprinting = msg.sprinting;
      remotePlayer.crouching = msg.crouching;
      remotePlayer.equippedWeaponId = msg.equippedWeaponId;
    } else if (msg.t === 'attack') {
      remotePlayer.attackSeq++;
    } else if (msg.t === 'tribeSync') {
      Object.assign(remoteTribeMembers, msg.members);
      const gs = useGame.getState();
      gs.setTribeMemberState(msg.tribeMemberState);
      gs.setCapturedTribes(msg.capturedTribes);
      gs.setActiveTribeIds(msg.activeTribeIds);
      if (gs.mpRole === 'joiner') {
        if (msg.raid && !gs.raid) gs.addToast(`⚠️ ${msg.raid.tribeName} is raiding!`);
        else if (!msg.raid && gs.raid) gs.addToast(`${gs.raid.tribeName} retreats!`);
        gs.setRaid(msg.raid ?? null);
        if (msg.distantRaid && !gs.distantRaid) gs.addToast(`🏔️ ${msg.distantRaid.tribeName} is marching on you!`);
        else if (!msg.distantRaid && gs.distantRaid) gs.addToast(`${gs.distantRaid.tribeName} retreats!`);
        gs.setDistantRaid(msg.distantRaid ?? null);
        if (msg.interTribalRaid && !gs.interTribalRaid) gs.addToast(`${msg.interTribalRaid.attackerName} raids ${msg.interTribalRaid.targetName}!`);
        gs.setInterTribalRaid(msg.interTribalRaid ?? null);
      }
    } else if (msg.t === 'tribeDamage') {
      if (useGame.getState().mpRole === 'host') {
        useGame.getState().damageTribeMember(msg.id, msg.dmg);
      }
    } else if (msg.t === 'chat') {
      useGame.getState().addChatMessage('friend', msg.text);
    }
  });
  const onClose = () => {
    remotePlayer.active = false;
    if (mpState.conn === conn) {
      mpState.conn = null;
      useGame.getState().setMpStatus('offline');
      useGame.getState().setMpRole(null);
    }
  };
  conn.on('close', onClose);
  conn.on('error', onClose);
}

function mpHost() {
  mpDisconnect();
  const code = randomMpCode();
  const peer = new Peer(`jungleking-${code}`);
  mpState.peer = peer;
  useGame.getState().setMpStatus('hosting');
  useGame.getState().setMpCode(code);
  useGame.getState().setMpError(null);
  useGame.getState().setMpRole('host');
  peer.on('connection', (conn) => mpSetupConnection(conn));
  peer.on('error', (err) => {
    useGame.getState().setMpError(err && err.type === 'unavailable-id'
      ? 'That code is in use, try hosting again for a new one.'
      : 'Connection error: ' + (err && err.type || 'unknown'));
    useGame.getState().setMpStatus('offline');
  });
}

function mpJoin(code) {
  mpDisconnect();
  const peer = new Peer();
  mpState.peer = peer;
  useGame.getState().setMpStatus('connecting');
  useGame.getState().setMpError(null);
  useGame.getState().setMpRole('joiner');
  peer.on('open', () => {
    const conn = peer.connect(`jungleking-${code.trim().toUpperCase()}`);
    mpSetupConnection(conn);
  });
  peer.on('error', (err) => {
    useGame.getState().setMpError(err && err.type === 'peer-unavailable'
      ? 'No game found with that code.'
      : 'Connection error: ' + (err && err.type || 'unknown'));
    useGame.getState().setMpStatus('offline');
  });
}

function mpDisconnect() {
  if (mpState.conn) { try { mpState.conn.close(); } catch (e) {} }
  if (mpState.peer) { try { mpState.peer.destroy(); } catch (e) {} }
  mpState.conn = null;
  mpState.peer = null;
  remotePlayer.active = false;
  useGame.getState().setMpStatus('offline');
  useGame.getState().setMpCode('');
  useGame.getState().setMpRole(null);
}

function mpSend(msg) {
  if (mpState.conn && mpState.conn.open) {
    try { mpState.conn.send(msg); } catch (e) {}
  }
}

// Lazily-created shared audio context for tiny procedural sound effects
// (no audio assets in this project - everything is synthesized).
let sharedAudioCtx = null;
function playChingSound() {
  try {
    if (!sharedAudioCtx) sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = sharedAudioCtx;
    if (ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;
    [2200, 3300].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.22 / (i + 1), now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.3);
    });
  } catch (err) {
    // Audio not available - ignore.
  }
}

// ============================================================
// shake.js - camera shake when the player takes a hit
// ============================================================
// Trauma-based: a hit raises `trauma`, which then decays on its own. The camera
// offset scales with trauma *squared*, so a shake punches hard and settles fast
// instead of trailing off in a long wobble. Kept as a plain mutable object, like
// playerTransform, so damage can trigger it without any per-frame store churn.
const screenShake = { trauma: 0 };
const SHAKE_DURATION = 0.45;   // seconds for full trauma to decay to nothing
const SHAKE_MAX_OFFSET = 0.32; // world units of camera jolt at full trauma
const SHAKE_MAX_ROLL = 0.045;  // radians of camera roll at full trauma
const SHAKE_MIN_DAMAGE = 2;    // the 1hp/sec starvation tick must not rattle the screen

// The strongest hit wins rather than accumulating, so several raiders landing blows
// on the same frame can't stack the trauma into an unplayable earthquake.
function addScreenShake(damage) {
  if (!(damage >= SHAKE_MIN_DAMAGE)) return;
  const strength = Math.min(1, 0.25 + damage * 0.03);
  screenShake.trauma = Math.max(screenShake.trauma, strength);
}

// Called once per frame after the camera has been placed, so the jolt is a pure
// offset on top of wherever the camera already was.
function applyScreenShake(camera, delta) {
  if (screenShake.trauma <= 0) return;
  const t = screenShake.trauma * screenShake.trauma;
  const mag = SHAKE_MAX_OFFSET * t;
  camera.position.x += (Math.random() * 2 - 1) * mag;
  camera.position.y += (Math.random() * 2 - 1) * mag;
  camera.position.z += (Math.random() * 2 - 1) * mag;
  camera.rotation.z += (Math.random() * 2 - 1) * SHAKE_MAX_ROLL * t;
  screenShake.trauma = Math.max(0, screenShake.trauma - delta / SHAKE_DURATION);
}

// ============================================================
// interactions.js - "walk up and press a key" registry
// ============================================================
// Each entry: { id, position: [x,y,z], radius, action: 'interact'|'gather'|'craft', label, onInteract: fn }
// `action` is a rebindable action id (see keybinds.js), never a raw key code.
const interactables = [];

function registerInteractable(entry) {
  interactables.push(entry);
  return () => {
    const idx = interactables.indexOf(entry);
    if (idx >= 0) interactables.splice(idx, 1);
  };
}

function findNearest(position, maxRadius = Infinity) {
  let best = null;
  let bestDist = maxRadius;
  for (const it of interactables) {
    const dx = it.position[0] - position[0];
    const dz = it.position[2] - position[2];
    const d = Math.hypot(dx, dz);
    if (d <= (it.radius ?? 2.5) && d <= bestDist) {
      best = it;
      bestDist = d;
    }
  }
  return best;
}

// World resource node placement (positions are fixed for now)
function generateResourceNodes() {
  const nodes = [];
  const rand = mulberry32(1337);
  for (let i = 0; i < 24; i++) {
    const angle = rand() * Math.PI * 2;
    const dist = 8 + rand() * 60;
    nodes.push({
      id: `tree_${i}`,
      type: 'wood',
      position: [Math.cos(angle) * dist, 0, Math.sin(angle) * dist],
    });
  }
  for (let i = 0; i < 14; i++) {
    const angle = rand() * Math.PI * 2;
    const dist = 6 + rand() * 50;
    nodes.push({
      id: `bush_${i}`,
      type: 'fiber',
      position: [Math.cos(angle) * dist, 0, Math.sin(angle) * dist],
    });
  }
  for (let i = 0; i < 10; i++) {
    const angle = rand() * Math.PI * 2;
    const dist = 10 + rand() * 55;
    nodes.push({
      id: `rock_${i}`,
      type: 'stone',
      position: [Math.cos(angle) * dist, 0, Math.sin(angle) * dist],
    });
  }
  // Cave ore nodes — silver and gold near each cave entrance, require pickaxe
  for (const cave of CAVE_LOCATIONS) {
    const { mx, mz, r } = cave;
    const len = Math.sqrt(mx * mx + mz * mz);
    const dx = -mx / len, dz = -mz / len; // direction toward origin
    const px = -dz, pz = dx; // perpendicular
    const cx = mx + dx * r * 0.62;
    const cz = mz + dz * r * 0.62;
    nodes.push({ id: `silver_${cave.id}_1`, type: 'silver', position: [cx + px * 2.5, 0, cz + pz * 2.5] });
    nodes.push({ id: `silver_${cave.id}_2`, type: 'silver', position: [cx - px * 2.5, 0, cz - pz * 2.5] });
    nodes.push({ id: `gold_${cave.id}`,     type: 'gold',   position: [cx + dx * 3.5, 0, cz + dz * 3.5] });
  }
  // Nudge anything that landed in the pond out past the waterline. Two of the seeded
  // positions (a fiber bush and a rock) fall inside it, and now that the basin is
  // carved they would otherwise sit a couple of metres under the surface.
  for (const node of nodes) {
    const dx = node.position[0] - POND_CENTER[0];
    const dz = node.position[2] - POND_CENTER[1];
    const d = Math.hypot(dx, dz);
    if (d >= POND_RADIUS + 1) continue;
    const k = (POND_RADIUS + 2) / (d || 1);
    node.position[0] = POND_CENTER[0] + (d ? dx : 1) * k;
    node.position[2] = POND_CENTER[1] + (d ? dz : 0) * k;
  }
  return nodes;
}

// Pre-computed obstacle circles for player collision detection
const PLAYER_COLL_R = 0.35;
const _OBS_R = { wood: 0.72, stone: 0.55, silver: 0.32, gold: 0.32 };
const STATIC_OBSTACLES = generateResourceNodes()
  .filter((n) => _OBS_R[n.type])
  .map((n) => ({ id: n.id, x: n.position[0], z: n.position[2], r: _OBS_R[n.type] }));

// Deterministic PRNG so the world layout is stable across reloads
function mulberry32(seed) {
  return function () {
    seed |= 0;
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ============================================================
// store.js - zustand global state
// ============================================================
let toastId = 0;
let chatId = 0;

const useGame = create((set, get) => ({
  // --- currency ---
  meters: 0,
  addMeters: (amount) => set((s) => ({ meters: s.meters + amount })),
  spendMeters: (amount) => {
    if (get().meters < amount) return false;
    set((s) => ({ meters: s.meters - amount }));
    return true;
  },

  // --- survival stats (0-100) ---
  stats: {
    health: 100,
    hunger: 100,
    thirst: 100,
    energy: 100,
    warmth: 100,
    sanity: 100,
  },
  adjustStat: (key, delta) => {
    // Losing health jolts the camera. Triggered here, not at each damage site, because
    // every raider, animal, spear and starvation tick funnels through adjustStat. No
    // shake once dead: hostiles keep swinging at the body and it would never settle.
    if (key === 'health' && delta < 0 && !get().dead) addScreenShake(-delta);
    return set((s) => {
      const next = Math.max(0, Math.min(100, s.stats[key] + delta));
      const stats = { ...s.stats, [key]: next };
      // Health reaching zero is death, detected here because everything that can hurt
      // the player — raiders, tribe members, animals, starvation, thirst — funnels
      // through adjustStat. The !s.dead guard keeps later hits from re-triggering it.
      if (key === 'health' && next <= 0 && !s.dead) {
        const cause = s.stats.thirst <= 0 ? 'You died of thirst.'
          : s.stats.hunger <= 0 ? 'You starved to death.'
          : 'The jungle got you.';
        return { stats, dead: true, deathCause: cause };
      }
      return { stats };
    });
  },

  // --- death / respawn ---
  dead: false,
  deathCause: null,
  deathCount: 0, // bumped on respawn; Player watches it to move you back to camp
  respawn: () => {
    set((s) => ({
      dead: false,
      deathCause: null,
      deathCount: s.deathCount + 1,
      // Every survival stat goes back to full, not just health: respawning with an
      // empty thirst bar would start the 1hp/sec starvation tick again immediately
      // and kill you a second time without you touching anything.
      stats: { health: 100, hunger: 100, thirst: 100, energy: 100, warmth: 100, sanity: 100 },
      activePanel: null,
    }));
    get().addToast('You wake up back at your camp');
  },

  // --- time of day, 0-24 hours ---
  timeOfDay: 8,
  setTimeOfDay: (t) => set({ timeOfDay: ((t % 24) + 24) % 24 }),

  // --- inventory: itemId -> quantity ---
  inventory: { spear: 1 },
  addItem: (id, qty = 1) =>
    set((s) => ({ inventory: { ...s.inventory, [id]: (s.inventory[id] || 0) + qty } })),
  removeItem: (id, qty = 1) => {
    const have = get().inventory[id] || 0;
    if (have < qty) return false;
    set((s) => {
      const next = { ...s.inventory, [id]: have - qty };
      if (next[id] <= 0) delete next[id];
      return { inventory: next };
    });
    return true;
  },
  hasItems: (cost) => {
    const inv = get().inventory;
    return Object.entries(cost).every(([k, v]) => (inv[k] || 0) >= v);
  },

  // --- resource nodes (gather/respawn) ---
  resourceNodes: generateResourceNodes(),
  depletedNodes: {}, // id -> respawnAtTimestamp
  gatherNode: (node) => {
    const id = node.id;
    if (get().depletedNodes[id]) return false;
    const s = get();
    const activeWeapon = s.hotbarSlots[s.activeHotbarSlot];

    if (node.type === 'wood') {
      if (activeWeapon === 'axe' && (s.inventory.axe || 0) > 0) {
        get().addItem('wood', 1);
        get().addToast('+1 Wood (chopped with Axe)');
      } else if (activeWeapon === 'machete' && (s.inventory.machete || 0) > 0) {
        get().addItem('leaves', 2);
        get().addToast('+2 Leaves (chopped with Machete)');
      } else {
        get().addToast('Equip an Axe to chop trees for wood!');
        return false;
      }
    } else if (node.type === 'stone') {
      if (activeWeapon !== 'pickaxe' || (s.inventory.pickaxe || 0) === 0) {
        get().addToast('Equip a Pickaxe to mine stone!');
        return false;
      }
      get().addItem('stone', 1);
      get().addToast('+1 Stone');
    } else if (node.type === 'silver' || node.type === 'gold') {
      if (activeWeapon !== 'pickaxe' || (s.inventory.pickaxe || 0) === 0) {
        get().addToast('Equip a Pickaxe to mine cave ore!');
        return false;
      }
      get().addItem(node.type, 1);
      get().addToast(`+1 ${RESOURCES[node.type].name}!`);
    } else {
      get().addItem(node.type, 1);
      get().addToast(`+1 ${RESOURCES[node.type].name}`);
    }

    set((st) => ({ depletedNodes: { ...st.depletedNodes, [id]: Date.now() + 30000 } }));
    return true;
  },
  // --- general loot scattered on the map: pick up with E, respawns over time ---
  collectedLoot: {}, // id -> respawnAtTimestamp
  collectLoot: (spawn) => {
    if (get().collectedLoot[spawn.id]) return false;
    get().addItem(spawn.item, spawn.qty);
    set((s) => ({ collectedLoot: { ...s.collectedLoot, [spawn.id]: Date.now() + LOOT_RESPAWN_MS } }));
    get().addToast(`Found ${spawn.qty}x ${RESOURCES[spawn.item]?.name || spawn.item}!`);
    return true;
  },
  tickRespawns: () => {
    const now = Date.now();
    const depleted = get().depletedNodes;
    let changed = false;
    const next = { ...depleted };
    for (const id of Object.keys(depleted)) {
      if (depleted[id] <= now) {
        delete next[id];
        changed = true;
      }
    }
    if (changed) set({ depletedNodes: next });

    const collected = get().collectedLoot;
    let lootChanged = false;
    const nextLoot = { ...collected };
    for (const id of Object.keys(collected)) {
      if (collected[id] <= now) {
        delete nextLoot[id];
        lootChanged = true;
      }
    }
    if (lootChanged) set({ collectedLoot: nextLoot });

    get().tickAnimalRespawns();
  },

  // --- wild animals: health, death, loot, respawn ---
  animalState: Object.fromEntries(ANIMAL_SPAWNS.map((a) => [a.id, { health: a.health, alive: true, respawnAt: 0 }])),
  damageAnimal: (id, dmg) => {
    const spawn = ANIMAL_SPAWNS.find((a) => a.id === id);
    const cur = get().animalState[id];
    if (!spawn || !cur || !cur.alive) return;
    const health = cur.health - dmg;
    if (health <= 0) {
      set((s) => ({ animalState: { ...s.animalState, [id]: { health: 0, alive: false, respawnAt: Date.now() + ANIMAL_RESPAWN_MS } } }));
      for (const [k, v] of Object.entries(spawn.loot)) get().addItem(k, v);
      get().addToast(`${spawn.type === 'boar' ? 'Boar' : 'Monkey'} down! Loot collected.`);
    } else {
      set((s) => ({ animalState: { ...s.animalState, [id]: { ...cur, health } } }));
    }
  },
  tickAnimalRespawns: () => {
    const now = Date.now();
    const state = get().animalState;
    let changed = false;
    const next = { ...state };
    for (const [id, st] of Object.entries(state)) {
      if (!st.alive && st.respawnAt && st.respawnAt <= now) {
        const spawn = ANIMAL_SPAWNS.find((a) => a.id === id);
        next[id] = { health: spawn.health, alive: true, respawnAt: 0 };
        changed = true;
      }
    }
    if (changed) set({ animalState: next });
    get().tickTribeMemberRespawns();
  },

  // --- rival tribe members at their camps: health, death, loot, respawn ---
  tribeMemberState: Object.fromEntries([
    ...ENEMY_TRIBES.flatMap((tribe) =>
      TRIBE_MEMBER_OFFSETS.map((_, i) => [`${tribe.id}_m${i}`, { health: TRIBE_MEMBER_HEALTH, alive: true, respawnAt: 0 }])
    ),
    ...DISTANT_TRIBES.flatMap((tribe) =>
      TRIBE_MEMBER_OFFSETS.map((_, i) => [`dt_${tribe.id}_m${i}`, { health: TRIBE_MEMBER_HEALTH, alive: true, respawnAt: 0 }])
    ),
  ]),
  damageTribeMember: (id, dmg) => {
    const cur = get().tribeMemberState[id];
    if (!cur || !cur.alive) return;
    const tribeId = id.split('_m')[0];
    // Alert the rest of the camp - they'll all rush to fight back for a while.
    set((s) => ({ alertedCamps: { ...s.alertedCamps, [tribeId]: Date.now() + CAMP_ALERT_DURATION_MS } }));
    const health = cur.health - dmg;
    if (health <= 0) {
      set((s) => ({ tribeMemberState: { ...s.tribeMemberState, [id]: { health: 0, alive: false, respawnAt: Date.now() + TRIBE_MEMBER_RESPAWN_MS } } }));
      get().addMeters(TRIBE_MEMBER_REWARD.meters);
      get().addToast(`Rival tribesperson defeated! +${TRIBE_MEMBER_REWARD.meters}m`);
      if (ENEMY_TRIBES.some((t) => t.id === tribeId)) get().checkCampCapture(tribeId);
    } else {
      set((s) => ({ tribeMemberState: { ...s.tribeMemberState, [id]: { ...cur, health } } }));
    }
  },
  // --- alerted camps: when one member is attacked, the whole camp aggros for a while ---
  alertedCamps: {},
  // --- rival tribes that have "spawned in" and have an active camp on the map ---
  activeTribeIds: ENEMY_TRIBES.slice(0, ENEMY_TRIBES_INITIAL_COUNT).map((t) => t.id),
  setActiveTribeIds: (v) => set({ activeTribeIds: v }),
  spawnNextTribe: () => {
    // The host's tribeSync broadcast is authoritative for joiners.
    if (get().mpRole === 'joiner') return;
    const active = get().activeTribeIds;
    const next = ENEMY_TRIBES.find((t) => !active.includes(t.id));
    if (!next) return;
    set((s) => ({ activeTribeIds: [...s.activeTribeIds, next.id] }));
    get().addToast(`A new rival tribe has arrived: ${next.name}!`);
  },

  // --- captured rival camps: become the player's once every member is defeated ---
  capturedTribes: {},
  campOwners: {}, // { [tribeId]: ownerTribeId } — which enemy tribe currently controls this camp
  setCampOwner: (tribeId, ownerId) => set((s) => ({ campOwners: { ...s.campOwners, [tribeId]: ownerId } })),
  checkCampCapture: (tribeId) => {
    if (get().capturedTribes[tribeId]) return;
    const state = get().tribeMemberState;
    const allDown = TRIBE_MEMBER_OFFSETS.every((_, i) => !state[`${tribeId}_m${i}`]?.alive);
    if (!allDown) return;
    set((s) => {
      const campOwners = { ...s.campOwners };
      delete campOwners[tribeId];
      return { capturedTribes: { ...s.capturedTribes, [tribeId]: true }, campOwners };
    });
    get().addMeters(CAMP_CAPTURE_REWARD.meters);
    get().addCoins(CAMP_CAPTURE_REWARD.coins);
    const tribe = ENEMY_TRIBES.find((t) => t.id === tribeId);
    get().addToast(`${tribe.name}'s camp is now yours! +${CAMP_CAPTURE_REWARD.meters}m, +${CAMP_CAPTURE_REWARD.coins}c`);
    get().addToast(`3 tribespeople from ${tribe.name} join your side and settle into the camp!`);
    get().initGarrison(tribe.id);
  },
  tickTribeMemberRespawns: () => {
    // The host's tribeSync broadcast is authoritative for joiners.
    if (get().mpRole === 'joiner') return;
    const now = Date.now();
    const state = get().tribeMemberState;
    const captured = get().capturedTribes;
    let changed = false;
    const next = { ...state };
    for (const [id, st] of Object.entries(state)) {
      if (captured[id.split('_m')[0]]) continue; // captured camps stay empty
      if (!st.alive && st.respawnAt && st.respawnAt <= now) {
        next[id] = { health: TRIBE_MEMBER_HEALTH, alive: true, respawnAt: 0 };
        changed = true;
      }
    }
    if (changed) set({ tribeMemberState: next });
  },

  // --- weapon combat: thrown spears lying on the ground, and damage resolution ---
  groundWeapons: [], // [{ id, weaponId, position: [x,y,z] }]
  pickupWeapon: (groundId) => {
    const gw = get().groundWeapons.find((g) => g.id === groundId);
    if (!gw) return false;
    get().addItem(gw.weaponId, 1);
    set((s) => ({ groundWeapons: s.groundWeapons.filter((g) => g.id !== groundId) }));
    get().addToast(`Picked up ${WEAPONS[gw.weaponId].name}`);
    return true;
  },
  // Finds the closest animal/raider in front of the player within `range`.
  findAttackTarget: (range) => {
    const [px, , pz] = playerTransform.position;
    const yaw = playerTransform.yaw;
    const dirX = -Math.sin(yaw);
    const dirZ = -Math.cos(yaw);
    let best = null;
    let bestDist = range;
    for (const [id, pos] of Object.entries(entityRegistry.animals)) {
      if (!get().animalState[id]?.alive) continue;
      const dx = pos.x - px, dz = pos.z - pz;
      const dist = Math.hypot(dx, dz);
      if (dist > range || dist === 0) continue;
      const dot = (dx / dist) * dirX + (dz / dist) * dirZ;
      if (dot > Math.cos(ATTACK_CONE / 2) && dist <= bestDist) { best = { kind: 'animal', id, dist }; bestDist = dist; }
    }
    const raid = get().raid;
    if (raid) {
      for (const r of raid.raiders) {
        const pos = entityRegistry.raiders[r.id];
        if (!pos) continue;
        const dx = pos.x - px, dz = pos.z - pz;
        const dist = Math.hypot(dx, dz);
        if (dist > range || dist === 0) continue;
        const dot = (dx / dist) * dirX + (dz / dist) * dirZ;
        if (dot > Math.cos(ATTACK_CONE / 2) && dist <= bestDist) { best = { kind: 'raider', id: r.id, dist }; bestDist = dist; }
      }
    }
    for (const [id, pos] of Object.entries(entityRegistry.tribeMembers)) {
      if (!get().tribeMemberState[id]?.alive) continue;
      const dx = pos.x - px, dz = pos.z - pz;
      const dist = Math.hypot(dx, dz);
      if (dist > range || dist === 0) continue;
      const dot = (dx / dist) * dirX + (dz / dist) * dirZ;
      if (dot > Math.cos(ATTACK_CONE / 2) && dist <= bestDist) { best = { kind: 'tribeMember', id, dist }; bestDist = dist; }
    }
    const dr = get().distantRaid;
    if (dr) {
      for (const r of dr.raiders) {
        const pos = entityRegistry.distantRaiders[r.id];
        if (!pos) continue;
        const dx = pos.x - px, dz = pos.z - pz;
        const dist = Math.hypot(dx, dz);
        if (dist > range || dist === 0) continue;
        const dot = (dx / dist) * dirX + (dz / dist) * dirZ;
        if (dot > Math.cos(ATTACK_CONE / 2) && dist <= bestDist) { best = { kind: 'distantRaider', id: r.id, dist }; bestDist = dist; }
      }
    }
    const itr = get().interTribalRaid;
    if (itr) {
      for (const r of itr.raiders) {
        const pos = entityRegistry.interTribalRaiders[r.id];
        if (!pos) continue;
        const dx = pos.x - px, dz = pos.z - pz;
        const dist = Math.hypot(dx, dz);
        if (dist > range || dist === 0) continue;
        const dot = (dx / dist) * dirX + (dz / dist) * dirZ;
        if (dot > Math.cos(ATTACK_CONE / 2) && dist <= bestDist) { best = { kind: 'interTribalRaider', id: r.id, dist }; bestDist = dist; }
      }
    }
    return best;
  },
  applyDamageToTarget: (target, dmg) => {
    if (target.kind === 'animal') get().damageAnimal(target.id, dmg);
    else if (target.kind === 'raider') get().damageRaider(target.id, dmg);
    else if (target.kind === 'distantRaider') get().damageDistantRaider(target.id, dmg);
    else if (target.kind === 'interTribalRaider') get().damageInterTribalRaider(target.id, dmg);
    else if (target.kind === 'tribeMember') {
      // Rival tribe camps are simulated on the host; joiners ask the host
      // to apply the damage so health/captures stay in sync for both players.
      if (get().mpRole === 'joiner') mpSend({ t: 'tribeDamage', id: target.id, dmg });
      else get().damageTribeMember(target.id, dmg);
    }
  },
  // Spear poke: short-range stab, doesn't leave the player's hand.
  meleeAttack: (weaponId) => {
    const weapon = WEAPONS[weaponId];
    if (!weapon) return false;
    const dmg = weapon.pokeDamage ?? weapon.damage;
    const target = get().findAttackTarget(weapon.range);
    if (!target) return false;
    get().applyDamageToTarget(target, dmg);
    return true;
  },
  // Throws the equipped spear: it flies out, damages whatever it hits, and
  // lands on the ground to be picked back up later.
  flyingSpears: [], // [{ id, weaponId, start: [x,y,z], end: [x,y,z], startedAt }]
  throwWeapon: (weaponId) => {
    const weapon = WEAPONS[weaponId];
    if (!weapon || !weapon.throwable) return false;
    if (!get().removeItem(weaponId, 1)) return false;
    const [px, py, pz] = playerTransform.position;
    const yaw = playerTransform.yaw;
    const dirX = -Math.sin(yaw);
    const dirZ = -Math.cos(yaw);

    const target = get().findAttackTarget(THROW_RANGE);
    if (target) get().applyDamageToTarget(target, weapon.damage);

    const landDist = target ? Math.max(1, target.dist - 0.5) : THROW_RANGE;
    const landX = px + dirX * landDist;
    const landZ = pz + dirZ * landDist;
    const id = `gw_${Date.now()}_${Math.floor(Math.random() * 1000)}`;
    set((s) => ({
      flyingSpears: [...s.flyingSpears, {
        id, weaponId,
        start: [px + dirX * 0.6, py + 1.3, pz + dirZ * 0.6],
        end: [landX, getTerrainHeight(landX, landZ) + 0.05, landZ],
        startedAt: Date.now(),
      }],
    }));
    get().addToast(target ? `Spear hit its mark! Go pick it back up.` : `Spear thrown! Go pick it back up.`);
    return true;
  },
  landSpear: (id, posOverride) => {
    set((s) => {
      const spear = s.flyingSpears.find((f) => f.id === id);
      if (!spear) return {};
      return {
        flyingSpears: s.flyingSpears.filter((f) => f.id !== id),
        groundWeapons: [...s.groundWeapons, { id: spear.id, weaponId: spear.weaponId, position: posOverride ?? spear.end }],
      };
    });
  },

  // --- visual/audio effect events (e.g. machete "ching") ---
  fxEvents: [], // [{ id, type, position }]
  spawnFx: (type, position) => {
    const id = `fx_${Date.now()}_${Math.floor(Math.random() * 1000)}`;
    set((s) => ({ fxEvents: [...s.fxEvents, { id, type, position }] }));
  },
  removeFx: (id) => set((s) => ({ fxEvents: s.fxEvents.filter((f) => f.id !== id) })),

  // --- crafting ---
  craft: (recipeId) => {
    const recipe = CRAFTING_RECIPES.find((r) => r.id === recipeId);
    if (!recipe) return false;
    if (!get().hasItems(recipe.cost)) return false;
    for (const [k, v] of Object.entries(recipe.cost)) get().removeItem(k, v);
    get().addItem(recipe.id, 1);
    get().addToast(`Crafted ${recipe.name}`);
    return true;
  },

  // --- shop ---
  buyItem: (itemId) => {
    const item = SHOP_ITEMS.find((i) => i.id === itemId);
    if (!item) return false;
    if (!get().spendMeters(item.price)) {
      get().addToast(`Need ${item.price} meters for ${item.name}`);
      return false;
    }
    get().addItem(item.id, 1);
    get().addToast(`Bought ${item.name}`);
    return true;
  },

  // --- UI state ---
  activePanel: null, // null | 'inventory' | 'shop' | 'crafting' | 'build' | 'tribe' | 'multiplayer' | 'map' | 'settings'
  setActivePanel: (panel) => set({ activePanel: panel }),

  nearInteractable: null, // { type: 'gather'|'shop'|'craft', label, data }
  setNearInteractable: (v) => set({ nearInteractable: v }),

  // --- controls / settings ---
  keybinds: { ...activeBinds },
  lookSens: inputSettings.lookSens,
  invertY: inputSettings.invertY,
  setLookSens: (v) => { inputSettings.lookSens = v; saveInputSettings(); set({ lookSens: v }); },
  setInvertY: (v) => { inputSettings.invertY = v; saveInputSettings(); set({ invertY: v }); },
  graphicsQuality: graphicsSettings.quality,
  setGraphicsQuality: (q) => {
    if (!GRAPHICS_PRESETS[q]) return;
    graphicsSettings.quality = q;
    saveGraphicsSettings();
    set({ graphicsQuality: q });
  },
  brightness: graphicsSettings.brightness,
  setBrightness: (v) => {
    const b = Math.max(0.6, Math.min(1.8, v));
    graphicsSettings.brightness = b;
    saveGraphicsSettings();
    set({ brightness: b });
  },
  showStats: graphicsSettings.showStats,
  setShowStats: (v) => {
    graphicsSettings.showStats = !!v;
    saveGraphicsSettings();
    set({ showStats: !!v });
  },

  // Rebinding is a swap, never a steal: if `code` already belongs to another
  // action, that action inherits the key this one is giving up. So no action is
  // ever left keyless, and binding cycle-hotbar to P moves build (or whatever
  // held P) onto Q.
  setKeybind: (actionId, code) => {
    if (!code) return false;
    if (RESERVED_CODES.has(code)) {
      get().addToast(`${keyLabel(code)} is reserved for closing menus`);
      return false;
    }
    const binds = { ...get().keybinds };
    if (!(actionId in binds)) return false;
    const prev = binds[actionId];
    if (prev === code) return false;
    const displaced = Object.keys(binds).find((id) => id !== actionId && binds[id] === code);
    binds[actionId] = code;
    if (displaced) binds[displaced] = prev;
    setActiveBinds(binds);
    saveKeybinds(binds);
    set({ keybinds: binds });
    get().addToast(displaced
      ? `${actionLabel(actionId)} → ${keyLabel(code)}, swapped ${actionLabel(displaced)} → ${keyLabel(prev)}`
      : `${actionLabel(actionId)} → ${keyLabel(code)}`);
    return true;
  },
  resetKeybinds: () => {
    const binds = { ...DEFAULT_KEYBINDS };
    setActiveBinds(binds);
    saveKeybinds(binds);
    set({ keybinds: binds });

// ============================================================
// textures.js - procedural canvas textures, no image assets
//
// Everything here is generated at runtime from seeded noise, so the game
// stays a single file with no asset downloads. Each surface returns a small
// bundle { map, normalMap, roughnessMap } so materials get real relief and
// varying gloss instead of a flat colour.
// ============================================================
// Shared easing used by the noise lattice, the pond basin and the grass fade.
const smoothstep = (t) => t * t * (3 - 2 * t);

function makeCanvas(size, h) {
  const cv = document.createElement('canvas');
  cv.width = size;
  cv.height = h || size;
  return cv;
}

// Seamless value noise. The lattice wraps, so the resulting tile repeats with
// no visible seam. cellsY differs from cellsX for stretched grain (bark, water).
function latticeNoise(size, cellsX, cellsY, seed) {
  const rand = mulberry32(seed);
  const cx = Math.max(1, Math.round(cellsX));
  const cy = Math.max(1, Math.round(cellsY));
  const g = new Float32Array(cx * cy);
  for (let i = 0; i < g.length; i++) g[i] = rand();
  const out = new Float32Array(size * size);
  for (let y = 0; y < size; y++) {
    const fy = (y / size) * cy;
    const y0 = Math.floor(fy);
    const ty = smoothstep(fy - y0);
    const ry0 = ((y0 % cy) + cy) % cy;
    const ry1 = (ry0 + 1) % cy;
    for (let x = 0; x < size; x++) {
      const fx = (x / size) * cx;
      const x0 = Math.floor(fx);
      const tx = smoothstep(fx - x0);
      const rx0 = ((x0 % cx) + cx) % cx;
      const rx1 = (rx0 + 1) % cx;
      const a = g[ry0 * cx + rx0], b = g[ry0 * cx + rx1];
      const c = g[ry1 * cx + rx0], d = g[ry1 * cx + rx1];
      out[y * size + x] = (a + (b - a) * tx) * (1 - ty) + (c + (d - c) * tx) * ty;
    }
  }
  return out;
}

// Stacked octaves of the above: the broad shapes come from the first octave,
// the grit from the last.
function fbm(size, cellsX, cellsY, octaves, seed) {
  const out = new Float32Array(size * size);
  let amp = 1, total = 0, cx = cellsX, cy = cellsY;
  for (let o = 0; o < octaves; o++) {
    const layer = latticeNoise(size, cx, cy, seed + o * 1013);
    for (let i = 0; i < out.length; i++) out[i] += layer[i] * amp;
    total += amp;
    amp *= 0.5;
    cx *= 2;
    cy *= 2;
  }
  for (let i = 0; i < out.length; i++) out[i] /= total;
  return out;
}

// Sobel the height field into a tangent-space normal map. Wrapping lookups keep
// the normals seamless across the tile edge, same as the height field.
function normalMapFromHeight(h, size, strength) {
  const cv = makeCanvas(size);
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(size, size);
  const at = (x, y) => h[(((y % size) + size) % size) * size + (((x % size) + size) % size)];
  const s = (strength === undefined ? 2 : strength) * size / 256;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const dx = (at(x + 1, y) - at(x - 1, y)) * s;
      const dy = (at(x, y + 1) - at(x, y - 1)) * s;
      const len = Math.sqrt(dx * dx + dy * dy + 1);
      const i = (y * size + x) * 4;
      img.data[i] = (-dx / len * 0.5 + 0.5) * 255;
      img.data[i + 1] = (-dy / len * 0.5 + 0.5) * 255;
      img.data[i + 2] = (1 / len * 0.5 + 0.5) * 255;
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

// Height field -> greyscale map, for roughness/AO style channels.
function greyCanvasFromField(field, size, lo, hi) {
  const cv = makeCanvas(size);
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(size, size);
  for (let i = 0; i < field.length; i++) {
    const v = Math.round((lo + (hi - lo) * field[i]) * 255);
    const o = i * 4;
    img.data[o] = img.data[o + 1] = img.data[o + 2] = v;
    img.data[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

// Map a 0..1 noise value through colour stops.
function rampColor(stops, t) {
  if (t <= stops[0].t) return stops[0].rgb;
  for (let i = 0; i < stops.length - 1; i++) {
    const a = stops[i], b = stops[i + 1];
    if (t <= b.t) {
      const f = (t - a.t) / (b.t - a.t || 1);
      return [
        a.rgb[0] + (b.rgb[0] - a.rgb[0]) * f,
        a.rgb[1] + (b.rgb[1] - a.rgb[1]) * f,
        a.rgb[2] + (b.rgb[2] - a.rgb[2]) * f,
      ];
    }
  }
  return stops[stops.length - 1].rgb;
}

function makeRamp(list) {
  return list.map(([t, hex]) => ({ t, rgb: hexToRgb(hex) }));
}

// Paint a colour ramp over a noise field, optionally modulated by a second
// field so the albedo doesn't track the relief exactly (real surfaces don't).
function albedoCanvas(size, field, ramp, tintField, tintAmount) {
  const cv = makeCanvas(size);
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(size, size);
  for (let i = 0; i < field.length; i++) {
    const c = rampColor(ramp, field[i]);
    const m = tintField ? 1 + (tintField[i] - 0.5) * tintAmount : 1;
    const o = i * 4;
    img.data[o] = Math.max(0, Math.min(255, c[0] * m));
    img.data[o + 1] = Math.max(0, Math.min(255, c[1] * m));
    img.data[o + 2] = Math.max(0, Math.min(255, c[2] * m));
    img.data[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

function texFrom(canvas, repeat, srgb) {
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeat[0], repeat[1]);
  tex.anisotropy = 8;
  if (srgb) tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// ---------- Surface bundles ----------
// Each builder returns { map, normalMap, roughnessMap } ready to spread onto a
// meshStandardMaterial. Built lazily and cached by SURFACES below.

function buildGroundSurface(size) {
  // Jungle floor: damp earth under a scatter of leaf litter and pebbles.
  const base = fbm(size, 4, 4, 5, 1201);
  const patch = fbm(size, 2, 2, 3, 7717);
  const grit = fbm(size, 24, 24, 2, 3301);
  const ramp = makeRamp([
    [0.00, '#24351a'], [0.32, '#33491f'], [0.52, '#405a26'],
    [0.70, '#55502b'], [0.86, '#6b5633'], [1.00, '#7d6740'],
  ]);
  const cv = albedoCanvas(size, base, ramp, patch, 0.45);
  const ctx = cv.getContext('2d');
  // Fallen leaves and twigs, the detail you actually notice underfoot.
  const rand = mulberry32(5150);
  for (let i = 0; i < Math.round(size * 1.6); i++) {
    const x = rand() * size, y = rand() * size;
    const r = size * (0.006 + rand() * 0.016);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rand() * Math.PI * 2);
    ctx.globalAlpha = 0.25 + rand() * 0.4;
    ctx.fillStyle = rand() > 0.45 ? '#6f6433' : '#4c6b2c';
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 2.4, r, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  for (let i = 0; i < Math.round(size * 0.5); i++) {
    const x = rand() * size, y = rand() * size;
    const r = size * (0.004 + rand() * 0.008);
    ctx.globalAlpha = 0.3 + rand() * 0.3;
    ctx.fillStyle = rand() > 0.5 ? '#8d8477' : '#5d564c';
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // Pebbles push the relief up; damp hollows read as smoother.
  const height = new Float32Array(size * size);
  for (let i = 0; i < height.length; i++) height[i] = base[i] * 0.65 + grit[i] * 0.35;
  return {
    map: texFrom(cv, [1, 1], true),
    normalMap: texFrom(normalMapFromHeight(height, size, 2.6), [1, 1], false),
    roughnessMap: texFrom(greyCanvasFromField(patch, size, 0.72, 1.0), [1, 1], false),
  };
}

function buildBarkSurface(size) {
  // Vertical grain: many cells across, few down, so the noise stretches into
  // ridges that run with the trunk.
  const grain = fbm(size, 10, 2, 5, 4404);
  const deep = fbm(size, 3, 1, 3, 9091);
  const ramp = makeRamp([
    [0.00, '#241a10'], [0.30, '#3b2a18'], [0.55, '#553d24'],
    [0.78, '#6d5133'], [1.00, '#826444'],
  ]);
  const cv = albedoCanvas(size, grain, ramp, deep, 0.35);
  const ctx = cv.getContext('2d');
  // A few deep fissures, and patches of lichen for the humid look.
  const rand = mulberry32(8822);
  for (let i = 0; i < 18; i++) {
    const x = rand() * size;
    ctx.strokeStyle = `rgba(22,15,9,${0.25 + rand() * 0.4})`;
    ctx.lineWidth = size * (0.004 + rand() * 0.012);
    ctx.beginPath();
    ctx.moveTo(x, 0);
    let cxp = x;
    for (let y = 0; y <= size; y += size / 8) {
      cxp += (rand() - 0.5) * size * 0.05;
      ctx.lineTo(cxp, y);
    }
    ctx.stroke();
  }
  for (let i = 0; i < 26; i++) {
    ctx.globalAlpha = 0.07 + rand() * 0.12;
    ctx.fillStyle = rand() > 0.5 ? '#7f8c5a' : '#5d6b4a';
    ctx.beginPath();
    ctx.ellipse(rand() * size, rand() * size, size * 0.03 * (0.5 + rand()), size * 0.05 * (0.5 + rand()), rand() * 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  const height = new Float32Array(size * size);
  for (let i = 0; i < height.length; i++) height[i] = grain[i] * 0.75 + deep[i] * 0.25;
  return {
    map: texFrom(cv, [1, 1], true),
    normalMap: texFrom(normalMapFromHeight(height, size, 4.5), [1, 1], false),
    roughnessMap: texFrom(greyCanvasFromField(grain, size, 0.75, 1.0), [1, 1], false),
  };
}

function buildLeafSurface(size) {
  // Canopy foliage seen from a distance: clumped light and shade with veins.
  const clump = fbm(size, 5, 5, 4, 2211);
  const fine = fbm(size, 20, 20, 2, 6612);
  const ramp = makeRamp([
    [0.00, '#15300f'], [0.28, '#22491a'], [0.52, '#326b24'],
    [0.76, '#448c2e'], [1.00, '#62ad3f'],
  ]);
  const cv = albedoCanvas(size, clump, ramp, fine, 0.3);
  const ctx = cv.getContext('2d');
  // Individual leaf silhouettes so the canopy doesn't read as mossy fuzz.
  const rand = mulberry32(3737);
  for (let i = 0; i < Math.round(size * 1.1); i++) {
    const x = rand() * size, y = rand() * size;
    const r = size * (0.012 + rand() * 0.03);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rand() * Math.PI * 2);
    const lit = rand();
    ctx.globalAlpha = 0.3 + rand() * 0.4;
    ctx.fillStyle = lit > 0.6 ? '#6cba46' : lit > 0.3 ? '#3c7d28' : '#1d4415';
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 0.55, r, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(20,45,15,0.35)';
    ctx.lineWidth = Math.max(1, size * 0.002);
    ctx.beginPath();
    ctx.moveTo(0, -r);
    ctx.lineTo(0, r);
    ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  const height = new Float32Array(size * size);
  for (let i = 0; i < height.length; i++) height[i] = clump[i] * 0.6 + fine[i] * 0.4;
  return {
    map: texFrom(cv, [1, 1], true),
    normalMap: texFrom(normalMapFromHeight(height, size, 3.2), [1, 1], false),
    roughnessMap: texFrom(greyCanvasFromField(fine, size, 0.55, 0.9), [1, 1], false),
  };
}

function buildRockSurface(size) {
  const body = fbm(size, 5, 5, 5, 1717);
  const crack = fbm(size, 14, 14, 3, 4242);
  const ramp = makeRamp([
    [0.00, '#3b3a37'], [0.30, '#565450'], [0.58, '#6e6c66'],
    [0.82, '#85837b'], [1.00, '#9c998f'],
  ]);
  const cv = albedoCanvas(size, body, ramp, crack, 0.3);
  const ctx = cv.getContext('2d');
  const rand = mulberry32(2929);
  for (let i = 0; i < 14; i++) {
    ctx.strokeStyle = `rgba(28,27,25,${0.2 + rand() * 0.35})`;
    ctx.lineWidth = size * (0.003 + rand() * 0.008);
    ctx.beginPath();
    let x = rand() * size, y = rand() * size;
    ctx.moveTo(x, y);
    for (let s = 0; s < 6; s++) {
      x += (rand() - 0.5) * size * 0.28;
      y += (rand() - 0.5) * size * 0.28;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  const height = new Float32Array(size * size);
  for (let i = 0; i < height.length; i++) height[i] = body[i] * 0.55 + crack[i] * 0.45;
  return {
    map: texFrom(cv, [1, 1], true),
    normalMap: texFrom(normalMapFromHeight(height, size, 4), [1, 1], false),
    roughnessMap: texFrom(greyCanvasFromField(crack, size, 0.8, 1.0), [1, 1], false),
  };
}

function buildSkinSurface(size, ramp) {
  const pores = fbm(size, 26, 26, 3, 6161);
  const blotch = fbm(size, 4, 4, 3, 8383);
  const cv = albedoCanvas(size, blotch, ramp, pores, 0.16);
  const height = new Float32Array(size * size);
  for (let i = 0; i < height.length; i++) height[i] = pores[i] * 0.8 + blotch[i] * 0.2;
  return {
    map: texFrom(cv, [1, 1], true),
    normalMap: texFrom(normalMapFromHeight(height, size, 1.1), [1, 1], false),
    roughnessMap: texFrom(greyCanvasFromField(pores, size, 0.52, 0.78), [1, 1], false),
  };
}

function buildClothSurface(size, ramp, seed) {
  // Woven weft: two crossed stretched noises read as thread.
  const warp = fbm(size, 48, 2, 2, seed);
  const weft = fbm(size, 2, 48, 2, seed + 77);
  const woven = new Float32Array(size * size);
  for (let i = 0; i < woven.length; i++) woven[i] = (warp[i] + weft[i]) * 0.5;
  const slub = fbm(size, 6, 6, 3, seed + 500);
  const cv = albedoCanvas(size, woven, ramp, slub, 0.3);
  return {
    map: texFrom(cv, [1, 1], true),
    normalMap: texFrom(normalMapFromHeight(woven, size, 2.2), [1, 1], false),
    roughnessMap: texFrom(greyCanvasFromField(slub, size, 0.78, 1.0), [1, 1], false),
  };
}

function buildFurSurface(size, ramp, seed) {
  // Directional strands rather than isotropic blobs.
  const strands = fbm(size, 40, 7, 3, seed);
  const shade = fbm(size, 5, 5, 3, seed + 311);
  const cv = albedoCanvas(size, strands, ramp, shade, 0.34);
  return {
    map: texFrom(cv, [1, 1], true),
    normalMap: texFrom(normalMapFromHeight(strands, size, 2.6), [1, 1], false),
    roughnessMap: texFrom(greyCanvasFromField(strands, size, 0.7, 0.95), [1, 1], false),
  };
}

// Water gets normals only - colour comes from the material and the sky
// reflection. Two copies of this scroll in different directions so the
// interference looks like real chop instead of a sliding pattern.
function buildWaterNormal(size) {
  const a = fbm(size, 6, 6, 4, 9311);
  const b = fbm(size, 11, 9, 3, 1559);
  const h = new Float32Array(size * size);
  for (let i = 0; i < h.length; i++) h[i] = a[i] * 0.6 + b[i] * 0.4;
  return normalMapFromHeight(h, size, 1.8);
}

// Soft round alpha blob, used for foam, dust motes and light shafts.
function buildSoftDisc(size) {
  const cv = makeCanvas(size);
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.45, 'rgba(255,255,255,0.55)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return cv;
}

// A single grass/fern blade with a soft alpha edge, for the leaf cards that
// fill out the undergrowth and palm fronds.
function buildBladeAlpha(size) {
  const cv = makeCanvas(size);
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, size, size);
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(size * 0.5, size);
  ctx.quadraticCurveTo(size * 0.02, size * 0.55, size * 0.5, 0);
  ctx.quadraticCurveTo(size * 0.98, size * 0.55, size * 0.5, size);
  ctx.fill();
  return cv;
}

// Lazily built, shared across every material that wants them. Building all of
// these up front would stall the first frame, so each is made on first access.
const SURFACES = {};
function surface(name) {
  if (SURFACES[name]) return SURFACES[name];
  let s;
  if (name === 'ground') s = buildGroundSurface(256);
  else if (name === 'bark') s = buildBarkSurface(256);
  else if (name === 'leaf') s = buildLeafSurface(256);
  else if (name === 'rock') s = buildRockSurface(256);
  else if (name === 'skin') s = buildSkinSurface(128, makeRamp([[0, '#8a5c38'], [0.5, '#a9764e'], [1, '#c89468']]));
  else if (name === 'skinPale') s = buildSkinSurface(128, makeRamp([[0, '#b07d52'], [0.5, '#d8a878'], [1, '#efc49a']]));
  else if (name === 'cloth') s = buildClothSurface(128, makeRamp([[0, '#3d3222'], [0.5, '#5a4632'], [1, '#776046']]), 404);
  else if (name === 'hide') s = buildClothSurface(128, makeRamp([[0, '#4a3722'], [0.5, '#6b5133'], [1, '#8a6a46']]), 909);
  else if (name === 'boarFur') s = buildFurSurface(128, makeRamp([[0, '#241a12'], [0.5, '#3f2f20'], [1, '#5c4730']]), 1212);
  else if (name === 'monkeyFur') s = buildFurSurface(128, makeRamp([[0, '#3b2516'], [0.5, '#6b4a2e'], [1, '#8e6a44']]), 1313);
  else throw new Error('unknown surface ' + name);
  SURFACES[name] = s;
  return s;
}

// Building every surface costs a couple of hundred milliseconds all told. Left
// to happen lazily it lands as a stutter the moment you spawn, because that's
// when the first tree, the first person and the ground all ask for theirs at
// once. So the start screen builds them ahead of time, one per tick, which keeps
// the menu responsive and means the world is fully dressed before you see it.
const WARM_ORDER = [
  'ground', 'bark', 'leaf', 'rock',
  'skin', 'skinPale', 'cloth', 'hide', 'boarFur', 'monkeyFur',
];
let warmStarted = false;
function warmSurfaces(onDone) {
  if (warmStarted) {
    if (onDone) onDone();
    return () => {};
  }
  warmStarted = true;
  let i = 0;
  let timer = null;
  const step = () => {
    if (i >= WARM_ORDER.length) {
      // The derived maps are cheap next to the surfaces they come from.
      try {
        waterNormals();
        for (const name of ['ground', 'bark', 'leaf', 'rock', 'cloth']) grainTiled(name, [1, 1]);
      } catch (e) {}
      if (onDone) onDone();
      return;
    }
    try { surface(WARM_ORDER[i]); } catch (e) {}
    i++;
    timer = setTimeout(step, 0);
  };
  timer = setTimeout(step, 0);
  return () => { if (timer) clearTimeout(timer); };
}

// Same bundle, but the tiling is per-use: a tree trunk wants bark repeating
// differently from a wooden wall. Clones share the underlying canvas upload.
function surfaceTiled(name, repeat) {
  const key = name + '@' + repeat[0] + 'x' + repeat[1];
  if (SURFACES[key]) return SURFACES[key];
  const base = surface(name);
  const out = {};
  for (const slot in base) {
    const t = base[slot].clone();
    t.needsUpdate = true;
    t.repeat.set(repeat[0], repeat[1]);
    out[slot] = t;
  }
  SURFACES[key] = out;
  return out;
}

// Tinting a full-colour albedo with a `color` just multiplies two colours and
// everything turns to mud. This strips a surface down to its light/dark grain,
// normalised around its own average, so `color` survives and only the texture's
// relief and variation come through.
const GRAIN = {};
function grainCanvasFor(name) {
  const cached = GRAIN['canvas:' + name];
  if (cached) return cached;
  const src = surface(name).map.image;
  const size = src.width;
  const d = src.getContext('2d').getImageData(0, 0, size, size).data;
  const lum = new Float32Array(size * size);
  let sum = 0;
  for (let i = 0; i < lum.length; i++) {
    const o = i * 4;
    lum[i] = (d[o] + d[o + 1] + d[o + 2]) / 765;
    sum += lum[i];
  }
  const mean = sum / lum.length || 0.5;
